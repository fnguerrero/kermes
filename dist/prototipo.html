<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kermés — prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07090c;overflow:hidden;
    font-family:'Cormorant Garamond',Georgia,serif;color:#e6ded0}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  .hud{position:fixed;left:0;right:0;bottom:0;padding:18px;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    pointer-events:none;z-index:3}
  .aviso{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.14em;
    text-transform:uppercase;color:#8f8798;background:rgba(7,9,13,.72);
    padding:7px 13px;border:1px solid #2a2432;border-radius:2px}
  .prompt{font-size:1.25rem;color:#ffd28a;text-shadow:0 2px 20px #000;
    opacity:0;transition:opacity .2s;text-align:center;margin:0}
  .prompt.on{opacity:1}
  .prompt b{font-family:'IBM Plex Mono',monospace;font-size:.78rem;
    border:1px solid #e8a33d;border-radius:3px;padding:2px 7px;margin-right:8px;
    color:#e8a33d;font-weight:500}

  /* Carga del sentido */
  .carga{position:fixed;left:22px;top:20px;width:132px;z-index:3;pointer-events:none}
  .carga .etq{font-family:'IBM Plex Mono',monospace;font-size:.58rem;
    letter-spacing:.22em;text-transform:uppercase;color:#7d8aa8;margin-bottom:5px}
  .carga .riel{height:3px;background:rgba(120,140,190,.18);border-radius:2px;overflow:hidden}
  .carga .lleno{height:100%;width:100%;background:#8fa8e8;
    transition:width .1s linear,background .3s}
  .carga.gastando .lleno{background:#e8dc8f}
  .carga.vacia .lleno{background:#e8848f}

  /* El aviso del sentido: corto, arriba, sin caja */
  .senal{position:fixed;left:0;right:0;top:11%;text-align:center;margin:0;
    font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:.28em;
    text-transform:uppercase;color:rgba(200,215,255,.92);
    text-shadow:0 0 26px rgba(120,160,255,.7),0 2px 10px #000;
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
  .senal.on{opacity:1}

  /* La ficha de información */
  .ficha{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:min(520px,86vw);z-index:4;opacity:0;pointer-events:none;
    transition:opacity .45s cubic-bezier(.2,.8,.3,1),transform .45s cubic-bezier(.2,.8,.3,1)}
  .ficha.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ficha .caja{background:linear-gradient(160deg,rgba(13,17,30,.97),rgba(8,10,20,.97));
    border:1px solid rgba(140,165,230,.28);padding:22px 26px 20px;
    box-shadow:0 24px 70px rgba(0,0,0,.8),0 0 60px rgba(90,130,220,.10)}
  .ficha .tipo{font-family:'IBM Plex Mono',monospace;font-size:.6rem;
    letter-spacing:.3em;text-transform:uppercase;margin:0 0 10px}
  .ficha .txt{font-size:1.08rem;line-height:1.62;margin:0;color:#e8e2d8}
  .ficha .linea{height:1px;margin:14px 0 0;
    background:linear-gradient(to right,rgba(140,165,230,.5),transparent)}

  .tocar{position:fixed;inset:0;display:flex;z-index:1}
  .tocar div{flex:1}
  .tocar.oculto{display:none}
  /* La observación va en una caja al pie: flotando en el medio se pisaba con
     los carteles de las atracciones. */
  .rotulo{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    margin:0;width:min(600px,88vw);
    background:linear-gradient(160deg,rgba(20,15,12,.96),rgba(12,9,8,.96));
    border-left:2px solid rgba(232,163,61,.75);
    padding:15px 20px;font-size:1.02rem;line-height:1.6;
    color:rgba(250,232,208,.95);box-shadow:0 16px 44px rgba(0,0,0,.7);
    opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;z-index:3}
  .rotulo.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .contador{position:fixed;top:20px;right:22px;margin:0;
    font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.18em;
    color:rgba(190,205,255,.7);text-shadow:0 2px 14px #000;z-index:3}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tocar" id="tocar"><div data-dir="-1"></div><div data-dir="1"></div></div>

<div class="carga" id="carga">
  <div class="etq">sentido</div>
  <div class="riel"><div class="lleno" id="cargaLleno"></div></div>
</div>
<p class="contador" id="contador">0 / 9</p>
<p class="senal" id="senal"></p>
<p class="rotulo" id="rotulo"></p>

<div class="ficha" id="ficha">
  <div class="caja">
    <p class="tipo" id="fichaTipo"></p>
    <p class="txt" id="fichaTxt"></p>
    <div class="linea"></div>
  </div>
</div>

<div class="hud">
  <p class="prompt" id="prompt"></p>
  <p class="aviso" id="aviso">← → para caminar · espacio: sentido · E: acercarte</p>
</div>

<script>
/* ===== js/luna.js ===== */
/* La luna de esta noche, de verdad.
   Versión compacta: alcanza con la longitud del Sol y de la Luna para sacar la
   fase y el signo. Serie lunar ELP-2000 truncada (Meeus cap. 47) y Sol por la
   fórmula de precisión reducida del cap. 25, que da mejor de 0.01°.
   La fase decide qué atracciones están abiertas, así que cambia cada noche. */
var Luna = (function () {
  'use strict';

  var D2R = Math.PI / 180;
  function norm360(x) { x = x % 360; return x < 0 ? x + 360 : x; }
  function sind(x) { return Math.sin(x * D2R); }
  function cosd(x) { return Math.cos(x * D2R); }

  function julianDay(y, m, d, horas) {
    horas = horas || 0;
    if (m <= 2) { y -= 1; m += 12; }
    var a = Math.floor(y / 100);
    var b = 2 - a + Math.floor(a / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1))
      + d + b - 1524.5 + horas / 24;
  }

  /* Términos principales de la serie de longitud lunar: [D, M, M', F, coef].
     Con estos treinta el error queda muy por debajo del grado, que es todo lo
     que hace falta para saber la fase y en qué signo está. */
  var TERMINOS = [
    [0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],
    [0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],
    [2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],
    [0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],
    [4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],
    [2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],
    [2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],
    [2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236]
  ];

  function longitudLuna(jde) {
    var T = (jde - 2451545.0) / 36525.0;
    var Lp = 218.3164477 + 481267.88123421 * T - 0.0015786 * T * T + Math.pow(T, 3) / 538841;
    var D = 297.8501921 + 445267.1114034 * T - 0.0018819 * T * T;
    var M = 357.5291092 + 35999.0502909 * T - 0.0001536 * T * T;
    var Mp = 134.9633964 + 477198.8675055 * T + 0.0087414 * T * T;
    var F = 93.2720950 + 483202.0175233 * T - 0.0036539 * T * T;
    var E = 1 - 0.002516 * T - 0.0000074 * T * T;
    var A1 = 119.75 + 131.849 * T, A2 = 53.09 + 479264.290 * T;

    var suma = 0;
    for (var i = 0; i < TERMINOS.length; i++) {
      var r = TERMINOS[i];
      var arg = r[0] * D + r[1] * M + r[2] * Mp + r[3] * F;
      var ecc = Math.abs(r[1]) === 1 ? E : (Math.abs(r[1]) === 2 ? E * E : 1);
      suma += r[4] * ecc * sind(arg);
    }
    suma += 3958 * sind(A1) + 1962 * sind(Lp - F) + 318 * sind(A2);
    return norm360(Lp + suma / 1000000);
  }

  function longitudSol(jde) {
    var T = (jde - 2451545.0) / 36525.0;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * sind(M)
      + (0.019993 - 0.000101 * T) * sind(2 * M)
      + 0.000289 * sind(3 * M);
    return norm360(L0 + C);
  }

  var SIGNOS = ['Aries', 'Tauro', 'Géminis', 'Cáncer', 'Leo', 'Virgo',
    'Libra', 'Escorpio', 'Sagitario', 'Capricornio', 'Acuario', 'Piscis'];
  var GLIFOS = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
  var ELEMENTOS = ['fuego', 'tierra', 'aire', 'agua'];

  /* Nombre de la fase según la elongación, con los cortes que se usan siempre. */
  function nombreFase(elong) {
    if (elong < 22.5 || elong >= 337.5) return 'luna nueva';
    if (elong < 67.5) return 'creciente';
    if (elong < 112.5) return 'cuarto creciente';
    if (elong < 157.5) return 'gibosa creciente';
    if (elong < 202.5) return 'luna llena';
    if (elong < 247.5) return 'gibosa menguante';
    if (elong < 292.5) return 'cuarto menguante';
    return 'menguante';
  }

  /* Estado de la luna en una fecha. Sin argumento, ahora mismo. */
  function estado(fecha) {
    var f = fecha || new Date();
    var jd = julianDay(f.getUTCFullYear(), f.getUTCMonth() + 1, f.getUTCDate(),
      f.getUTCHours() + f.getUTCMinutes() / 60);
    // ΔT ronda los 70 s en estas décadas: para la fase es despreciable, pero
    // se aplica igual porque no cuesta nada.
    var jde = jd + 70 / 86400;
    var ll = longitudLuna(jde), ls = longitudSol(jde);
    var elong = norm360(ll - ls);
    var iluminacion = (1 - cosd(elong)) / 2;
    var signo = Math.floor(ll / 30);
    return {
      jd: jd,
      longitud: ll,
      longitudSol: ls,
      elongacion: elong,
      iluminacion: iluminacion,
      creciente: elong < 180,
      fase: nombreFase(elong),
      signo: signo,
      signoNombre: SIGNOS[signo],
      signoGlifo: GLIFOS[signo],
      elemento: ELEMENTOS[signo % 4],
      grado: ll - signo * 30,
      // Los treinta días del ciclo, para elegir variantes con algo estable.
      diaLunar: Math.floor(elong / 360 * 29.53)
    };
  }

  function texto(e) {
    var g = Math.floor(e.grado);
    var m = Math.floor((e.grado - g) * 60);
    return e.fase + ' · ' + g + '°' + (m < 10 ? '0' : '') + m + "' " + e.signoGlifo +
      ' ' + e.signoNombre;
  }

  return {
    julianDay: julianDay,
    longitudLuna: longitudLuna,
    longitudSol: longitudSol,
    estado: estado,
    texto: texto,
    SIGNOS: SIGNOS, GLIFOS: GLIFOS
  };
})();

/* ===== js/dibujo.js ===== */
/* Primitivas de dibujo compartidas por todas las escenas.
   Nada de imágenes: la feria entera se dibuja con canvas, así pesa poco y
   se puede animar cualquier cosa. Todas las medidas van en fracciones de la
   pantalla, para que la composición aguante cualquier tamaño. */
var Dib = (function () {
  'use strict';

  var cx = null, W = 0, H = 0, t = 0, luces = true;

  function usar(ctx, w, h, tiempo, hayLuces) {
    cx = ctx; W = w; H = h; t = tiempo;
    luces = hayLuces !== false;
  }
  var X = function (u) { return W * u; };
  var Y = function (v) { return H * v; };
  var U = function (u) { return Math.min(W, H * 1.9) * u; };

  /* --- fondo --- */

  var estrellas = [];
  function sembrar(n) {
    estrellas = [];
    n = n || Math.round(W * H / 8000);
    for (var i = 0; i < n; i++) {
      estrellas.push({
        x: Math.random() * W, y: Math.random() * H * .70,
        r: Math.random() * 1.2 + .25, f: Math.random() * 6.28,
        v: .4 + Math.random() * 1.1
      });
    }
  }

  // paleta: cada escena puede teñir su cielo
  function cielo(paleta) {
    var p = paleta || ['#070912', '#0c0f1f', '#171227', '#0a0810'];
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, p[0]); g.addColorStop(.42, p[1]);
    g.addColorStop(.72, p[2]); g.addColorStop(1, p[3]);
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);

    cx.save();
    for (var i = 0; i < estrellas.length; i++) {
      var e = estrellas[i];
      cx.globalAlpha = .2 + .5 * (0.5 + 0.5 * Math.sin(t * e.v + e.f));
      cx.fillStyle = '#cfd6ee';
      cx.beginPath(); cx.arc(e.x, e.y, e.r, 0, 6.2832); cx.fill();
    }
    cx.restore();
  }

  /* Luna con su fase real: iluminacion 0 (nueva) a 1 (llena).
     creciente decide de que lado queda la sombra. */
  function luna(u, v, radio, iluminacion, creciente) {
    var lx = X(u), ly = Y(v), lr = U(radio);
    var brillo = .05 + .17 * iluminacion;
    var halo = cx.createRadialGradient(lx, ly, lr * .8, lx, ly, lr * 4.2);
    halo.addColorStop(0, 'rgba(214,206,184,' + brillo + ')');
    halo.addColorStop(.4, 'rgba(214,206,184,' + (brillo * .3) + ')');
    halo.addColorStop(1, 'rgba(214,206,184,0)');
    cx.fillStyle = halo;
    cx.beginPath(); cx.arc(lx, ly, lr * 4.2, 0, 6.2832); cx.fill();

    cx.fillStyle = '#ded4bc';
    cx.beginPath(); cx.arc(lx, ly, lr, 0, 6.2832); cx.fill();
    // La sombra es otro circulo corrido: da media luna, gibosa o nueva.
    if (iluminacion < .98) {
      var corr = iluminacion * 2.05 * lr * (creciente ? -1 : 1);
      cx.save();
      cx.beginPath(); cx.arc(lx, ly, lr, 0, 6.2832); cx.clip();
      cx.fillStyle = 'rgba(12,15,31,.94)';
      cx.beginPath(); cx.arc(lx + corr, ly, lr * 1.02, 0, 6.2832); cx.fill();
      cx.restore();
    }
  }

  /* --- luz --- */

  // Bombita: punto nítido con halo corto. El desenfoque largo las volvía manchas.
  function bombita(x, y, r, col, p) {
    if (!luces) {
      cx.fillStyle = '#191522';
      cx.beginPath(); cx.arc(x, y, r * .85, 0, 6.2832); cx.fill();
      return;
    }
    cx.save(); cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, r * 4.5);
    g.addColorStop(0, 'rgba(' + col + ',' + (.42 * p) + ')');
    g.addColorStop(.45, 'rgba(' + col + ',' + (.13 * p) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r * 4.5, 0, 6.2832); cx.fill();
    cx.fillStyle = 'rgba(255,242,220,' + (.95 * p) + ')';
    cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    cx.restore();
  }

  // Resplandor suelto, para focos y bocas de carpa.
  function resplandor(x, y, radio, col, alfa) {
    cx.save(); cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, radio);
    g.addColorStop(0, 'rgba(' + col + ',' + alfa + ')');
    g.addColorStop(.45, 'rgba(' + col + ',' + (alfa * .35) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, radio, 0, 6.2832); cx.fill();
    cx.restore();
  }

  var COLORES_GUIRNALDA = ['255,196,128', '196,96,104', '150,196,176'];

  function guirnalda(u1, v1, u2, v2, caida, semilla) {
    var x1 = X(u1), y1 = Y(v1), x2 = X(u2), y2 = Y(v2);
    cx.save();
    cx.strokeStyle = 'rgba(8,6,16,.95)'; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(x1, y1);
    cx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + caida, x2, y2);
    cx.stroke();
    var N = Math.max(7, Math.round(Math.abs(x2 - x1) / 38));
    for (var i = 0; i <= N; i++) {
      var u = i / N, iu = 1 - u;
      var x = iu * iu * x1 + 2 * iu * u * ((x1 + x2) / 2) + u * u * x2;
      var y = iu * iu * y1 + 2 * iu * u * ((y1 + y2) / 2 + caida) + u * u * y2;
      if (luces && Math.sin(t * 2.2 + i * .9 + semilla) < -.78) continue;  // quemada
      var p = .5 + .5 * (0.5 + 0.5 * Math.sin(t * 2.9 + i * 1.3 + semilla));
      bombita(x, y, 1.9, COLORES_GUIRNALDA[i % 3], p);
    }
    cx.restore();
  }

  /* --- construcciones --- */

  function carpa(u, vBase, ancho, alto, encendida) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    var cima = base - al * 1.12, hombro = base - al * .42;
    var gajos = 7;
    for (var i = 0; i < gajos; i++) {
      var u0 = i / gajos, u1 = (i + 1) / gajos;
      var x0 = x - an / 2 + an * u0, x1 = x - an / 2 + an * u1;
      cx.fillStyle = (i % 2 === 0) ? '#0b0812' : '#141021';
      cx.beginPath();
      cx.moveTo(x, cima);
      cx.lineTo(x0, hombro + Math.pow(Math.abs(u0 - .5) * 2, 2) * al * .16);
      cx.lineTo(x1, hombro + Math.pow(Math.abs(u1 - .5) * 2, 2) * al * .16);
      cx.closePath(); cx.fill();
    }
    cx.fillStyle = '#0b0812';
    cx.beginPath();
    cx.moveTo(x - an / 2, hombro + al * .16); cx.lineTo(x - an / 2, base);
    cx.lineTo(x + an / 2, base); cx.lineTo(x + an / 2, hombro + al * .16);
    cx.closePath(); cx.fill();

    if (encendida && luces) {
      var g = cx.createLinearGradient(x, hombro, x, base);
      g.addColorStop(0, 'rgba(232,163,61,.5)');
      g.addColorStop(1, 'rgba(168,50,63,.10)');
      cx.fillStyle = g;
      cx.beginPath();
      cx.moveTo(x - an * .15, base); cx.lineTo(x - an * .11, hombro + al * .08);
      cx.quadraticCurveTo(x, hombro - al * .02, x + an * .11, hombro + al * .08);
      cx.lineTo(x + an * .15, base); cx.closePath(); cx.fill();
    }
    cx.strokeStyle = '#0b0812'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x, cima); cx.lineTo(x, cima - al * .16); cx.stroke();
    cx.fillStyle = luces ? '#a8323f' : '#17121f';
    var on = Math.sin(t * 2.2 + x) * 3;
    cx.beginPath();
    cx.moveTo(x, cima - al * .16); cx.lineTo(x + 13 + on, cima - al * .115);
    cx.lineTo(x, cima - al * .07); cx.closePath(); cx.fill();
    cx.restore();
  }

  function portal(u, vBase, ancho, alto, rotulo) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    var gr = an * .062;
    cx.fillStyle = '#0b0812';
    cx.fillRect(x - an / 2, base - al, gr, al);
    cx.fillRect(x + an / 2 - gr, base - al, gr, al);
    cx.beginPath();
    cx.moveTo(x - an / 2, base - al);
    cx.quadraticCurveTo(x, base - al * 1.46, x + an / 2, base - al);
    cx.lineTo(x + an / 2, base - al * .88);
    cx.quadraticCurveTo(x, base - al * 1.30, x - an / 2, base - al * .88);
    cx.closePath(); cx.fill();

    if (luces) {
      var N = 17;
      for (var i = 0; i <= N; i++) {
        var uu = i / N, iu = 1 - uu;
        var bx = iu * iu * (x - an / 2) + 2 * iu * uu * x + uu * uu * (x + an / 2);
        var by = iu * iu * (base - al) + 2 * iu * uu * (base - al * 1.38) + uu * uu * (base - al);
        if (i === 5 && Math.sin(t * 7) < 0) continue;      // una que falla
        bombita(bx, by, 2.1, '255,206,140', .55 + .45 * Math.sin(t * 2.4 + i * .7));
      }
      if (rotulo) {
        cx.save();
        cx.globalCompositeOperation = 'lighter';
        cx.font = '600 ' + Math.round(al * .17) + "px 'Cormorant Garamond',serif";
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.shadowColor = 'rgba(255,168,64,.9)'; cx.shadowBlur = 26;
        cx.fillStyle = 'rgba(255,200,116,.92)';
        cx.fillText(rotulo, x, base - al * 1.08);
        if (Math.sin(t * 11) < -.2) {
          cx.shadowBlur = 0; cx.fillStyle = 'rgba(10,8,16,.85)';
          cx.fillText(rotulo.slice(0, -2) + ' ' + rotulo.slice(-1), x, base - al * 1.08);
        }
        cx.restore();
      }
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      var g2 = cx.createRadialGradient(x, base, 0, x, base, an * .72);
      g2.addColorStop(0, 'rgba(255,176,84,.11)');
      g2.addColorStop(.45, 'rgba(255,166,78,.04)');
      g2.addColorStop(1, 'rgba(255,166,78,0)');
      cx.fillStyle = g2;
      cx.beginPath(); cx.ellipse(x, base + al * .05, an * .72, al * .13, 0, 0, 6.2832); cx.fill();
      cx.restore();
    }
    cx.restore();
  }

  function vueltaAlMundo(u, v, radio, giro) {
    var cxp = X(u), cyp = Y(v), R = U(radio);
    cx.save();
    cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(2, R * .028);
    cx.beginPath(); cx.arc(cxp, cyp, R, 0, 6.2832); cx.stroke();
    cx.beginPath(); cx.arc(cxp, cyp, R * .92, 0, 6.2832); cx.stroke();
    var N = 16;
    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      var x = cxp + Math.cos(a) * R, y = cyp + Math.sin(a) * R;
      cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(1.2, R * .014);
      cx.beginPath(); cx.moveTo(cxp, cyp); cx.lineTo(x, y); cx.stroke();
      var cb = R * .07;
      cx.fillStyle = '#080610'; cx.fillRect(x - cb / 2, y, cb, cb * 1.3);
      if (Math.sin(t * 1.5 + i * 1.7) > -.55)
        bombita(x, y, Math.max(1.3, R * .014), '255,198,120', .5 + .5 * Math.sin(t * 2.6 + i));
    }
    cx.strokeStyle = '#080610'; cx.lineWidth = Math.max(2.5, R * .042);
    cx.beginPath();
    cx.moveTo(cxp - R * .42, cyp + R * 1.42); cx.lineTo(cxp, cyp);
    cx.lineTo(cxp + R * .42, cyp + R * 1.42); cx.stroke();
    cx.beginPath();
    cx.moveTo(cxp - R * .26, cyp + R * .9); cx.lineTo(cxp + R * .26, cyp + R * .9); cx.stroke();
    cx.restore();
  }

  /* Calesita: techo cónico, caballos girando en perspectiva achatada. */
  function calesita(u, vBase, ancho, alto, giro) {
    var x = X(u), base = Y(vBase), an = U(ancho), al = H * alto;
    cx.save();
    // Plataforma.
    cx.fillStyle = '#0b0812';
    cx.beginPath(); cx.ellipse(x, base, an * .5, an * .10, 0, 0, 6.2832); cx.fill();
    // Caballos y barras, ordenados por profundidad.
    var N = 8, piezas = [];
    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      piezas.push({ a: a, z: Math.sin(a) });
    }
    piezas.sort(function (p, q) { return p.z - q.z; });
    piezas.forEach(function (p) {
      var px = x + Math.cos(p.a) * an * .40;
      var py = base + Math.sin(p.a) * an * .085;
      var sube = Math.sin(t * 2.2 + p.a * 2) * al * .045;
      cx.strokeStyle = '#1b1626'; cx.lineWidth = Math.max(1.5, an * .008);
      cx.beginPath(); cx.moveTo(px, py); cx.lineTo(px, py - al * .70); cx.stroke();
      // Silueta de caballo, esquemática.
      cx.fillStyle = '#0d0a15';
      var cy = py - al * .28 + sube, cw = an * .075, ch = al * .10;
      cx.beginPath();
      cx.ellipse(px, cy, cw, ch * .55, 0, 0, 6.2832); cx.fill();
      cx.beginPath();
      cx.moveTo(px + cw * .55, cy - ch * .2);
      cx.lineTo(px + cw * 1.05, cy - ch * .95);
      cx.lineTo(px + cw * .72, cy - ch * 1.0);
      cx.lineTo(px + cw * .30, cy - ch * .35);
      cx.closePath(); cx.fill();
      cx.strokeStyle = '#0d0a15'; cx.lineWidth = Math.max(1.2, an * .007);
      [-.5, -.15, .2, .55].forEach(function (o) {
        cx.beginPath();
        cx.moveTo(px + cw * o, cy + ch * .35);
        cx.lineTo(px + cw * o + cw * .12, cy + ch * .95);
        cx.stroke();
      });
    });
    // Techo cónico a gajos.
    var cima = base - al;
    for (var j = 0; j < 10; j++) {
      var a0 = j / 10 * 6.2832, a1 = (j + 1) / 10 * 6.2832;
      cx.fillStyle = (j % 2 === 0) ? '#12101d' : '#0a0812';
      cx.beginPath();
      cx.moveTo(x, cima - al * .22);
      cx.lineTo(x + Math.cos(a0) * an * .52, base - al * .74 + Math.sin(a0) * an * .105);
      cx.lineTo(x + Math.cos(a1) * an * .52, base - al * .74 + Math.sin(a1) * an * .105);
      cx.closePath(); cx.fill();
    }
    // Bombitas del borde del techo.
    for (var k = 0; k < 14; k++) {
      var ak = k / 14 * 6.2832;
      var bx = x + Math.cos(ak) * an * .52;
      var by = base - al * .74 + Math.sin(ak) * an * .105;
      if (Math.sin(ak) < -.55) continue;    // las de atrás no se ven
      bombita(bx, by, 1.9, '255,200,132', .5 + .5 * Math.sin(t * 3 + k));
    }
    cx.restore();
  }

  /* --- carteles ---
     Los nombres de las atracciones tienen que estar pintados sobre algo, no
     flotando en el aire. Cada cartel es una tabla de madera con sus vetas,
     colgada de dos cadenas de un travesaño, con luces alrededor. */

  var MADERA = ['#7a5334', '#6b4729', '#875c3a', '#5e3f26'];

  /* x, y: el punto del que cuelga (el travesaño).
     opciones: { color, luces, ancho, alto, inclina } */
  function cartel(x, y, texto, op) {
    op = op || {};
    var an = op.ancho || U(.20);
    var al = op.alto || an * .30;
    var tinte = op.color || '#7a5334';
    var pinta = op.tinta || '#f0dcb4';
    // Cuelga con un vaivén muy leve, como cualquier cartel colgado.
    var vaiven = Math.sin(t * .55 + x * .01) * .012;
    var largoCadena = op.cadena === undefined ? al * .42 : op.cadena;

    cx.save();

    // Travesaño del que cuelga.
    if (op.travesano !== false) {
      cx.fillStyle = '#2a2030';
      cx.fillRect(x - an * .60, y - 4, an * 1.20, 7);
      cx.fillStyle = '#3a2e42';
      cx.fillRect(x - an * .60, y - 4, an * 1.20, 3);
    }

    cx.translate(x, y);
    cx.rotate(vaiven);

    // Cadenas.
    cx.strokeStyle = '#4a4055';
    cx.lineWidth = Math.max(1.5, an * .012);
    [-an * .38, an * .38].forEach(function (cxi) {
      cx.beginPath();
      cx.moveTo(cxi, 0);
      cx.lineTo(cxi, largoCadena);
      cx.stroke();
      // Eslabones.
      cx.fillStyle = '#5a4e66';
      for (var i = 1; i < 4; i++) {
        cx.beginPath();
        cx.arc(cxi, largoCadena * i / 4, Math.max(1.2, an * .009), 0, 6.2832);
        cx.fill();
      }
    });

    var ty = largoCadena;

    // Canto: la tabla tiene espesor.
    cx.fillStyle = '#3e2a1a';
    tabla(cx, 0, ty + 3, an, al);

    // Cara de la tabla, con las vetas.
    cx.save();
    tabla(cx, 0, ty, an, al);
    cx.clip();
    cx.fillStyle = tinte;
    cx.fillRect(-an * .55, ty - 4, an * 1.1, al + 8);
    // Vetas: franjas horizontales apenas distintas.
    for (var v = 0; v < 7; v++) {
      cx.fillStyle = MADERA[v % MADERA.length];
      cx.globalAlpha = .22;
      var vy = ty + al * (v / 7) + Math.sin(v * 2.3 + x) * 2;
      cx.fillRect(-an * .55, vy, an * 1.1, al * .07);
    }
    cx.globalAlpha = 1;
    // Sombra interior arriba y luz abajo: le da volumen.
    var g = cx.createLinearGradient(0, ty, 0, ty + al);
    g.addColorStop(0, 'rgba(0,0,0,.30)');
    g.addColorStop(.35, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(255,210,150,.10)');
    cx.fillStyle = g;
    cx.fillRect(-an * .55, ty - 4, an * 1.1, al + 8);
    cx.restore();

    // Borde pintado.
    cx.strokeStyle = 'rgba(30,18,10,.75)';
    cx.lineWidth = Math.max(1.5, an * .010);
    tabla(cx, 0, ty, an, al);
    cx.stroke();

    // Tornillos en las esquinas.
    cx.fillStyle = '#2e2418';
    [[-an * .42, ty + al * .18], [an * .42, ty + al * .18],
     [-an * .42, ty + al * .82], [an * .42, ty + al * .82]].forEach(function (t2) {
      cx.beginPath(); cx.arc(t2[0], t2[1], Math.max(1.2, an * .011), 0, 6.2832); cx.fill();
    });

    // El nombre, pintado a mano sobre la tabla.
    var cuerpo = op.cuerpo || al * .46;
    cx.font = "600 " + Math.round(cuerpo) + "px 'Cormorant Garamond',serif";
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    // Relieve: la pintura está gastada y deja ver la madera.
    cx.fillStyle = 'rgba(20,10,4,.55)';
    cx.fillText(texto, 1.5, ty + al * .52 + 1.5);
    cx.fillStyle = pinta;
    cx.fillText(texto, 0, ty + al * .52);

    cx.restore();

    // Bombitas del borde de arriba.
    if (op.luces !== false) {
      var N = op.nLuces || 7;
      for (var b = 0; b < N; b++) {
        var bx = x - an * .46 + an * .92 * b / (N - 1);
        var by = y + largoCadena - al * .06;
        if (Math.sin(t * 2.6 + b * 1.3 + x) < -.86) continue;
        bombita(bx, by, 2, op.colorLuz || '255,204,140',
          .5 + .5 * Math.sin(t * 2.2 + b * .8));
      }
    }
  }

  /* Contorno de la tabla, con las esquinas comidas como las de feria. */
  function tabla(cx, x, y, an, al) {
    var r = al * .16;
    cx.beginPath();
    cx.moveTo(x - an * .5 + r, y);
    cx.lineTo(x + an * .5 - r, y);
    cx.lineTo(x + an * .5, y + r);
    cx.lineTo(x + an * .5, y + al - r);
    cx.lineTo(x + an * .5 - r, y + al);
    cx.lineTo(x - an * .5 + r, y + al);
    cx.lineTo(x - an * .5, y + al - r);
    cx.lineTo(x - an * .5, y + r);
    cx.closePath();
  }

  /* Cartel clavado sobre dos patas, para el piso. */
  function carteliPie(x, piso, texto, op) {
    op = op || {};
    var an = op.ancho || U(.15);
    var al = op.alto || an * .34;
    var alto = op.altura || al * 2.2;
    cx.save();
    // Patas.
    cx.fillStyle = '#4a3524';
    cx.fillRect(x - an * .30, piso - alto, an * .07, alto);
    cx.fillRect(x + an * .23, piso - alto, an * .07, alto);
    cx.restore();
    cartel(x, piso - alto - 2, texto,
      Object.assign({ cadena: 0, travesano: false, ancho: an, alto: al }, op));
  }

  /* --- ambiente --- */

  function suelo(vHorizonte, charcos) {
    var y0 = Y(vHorizonte) - 6;
    var g = cx.createLinearGradient(0, y0, 0, H);
    g.addColorStop(0, 'rgba(7,5,13,.5)');
    g.addColorStop(.35, '#070510');
    g.addColorStop(1, '#040308');
    cx.fillStyle = g; cx.fillRect(0, y0, W, H - y0);
    if (luces && charcos) {
      cx.save(); cx.globalCompositeOperation = 'lighter';
      charcos.forEach(function (c, i) {
        var x = X(c[0]) + Math.sin(t * .45 + i * 2) * 4;
        var y = Y(vHorizonte) + H * (.055 + i * .028);
        var rx = U(.055 + c[1] * .18), ry = H * .012;
        var gg = cx.createRadialGradient(x, y, 0, x, y, rx);
        gg.addColorStop(0, 'rgba(255,178,92,' + (c[1] * .55) + ')');
        gg.addColorStop(1, 'rgba(255,178,92,0)');
        cx.fillStyle = gg;
        cx.beginPath(); cx.ellipse(x, y, rx, ry, 0, 0, 6.2832); cx.fill();
      });
      cx.restore();
    }
  }

  function niebla(v, alto, vel, alfa, tono) {
    var y = Y(v);
    cx.save(); cx.globalCompositeOperation = 'screen';
    var off = (t * vel) % (W + 400) - 200;
    for (var i = -1; i < 3; i++) {
      var x = off + i * (W * .6);
      var g = cx.createRadialGradient(x, y, 0, x, y, W * .4);
      g.addColorStop(0, 'rgba(' + tono + ',' + alfa + ')');
      g.addColorStop(1, 'rgba(' + tono + ',0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.ellipse(x, y, W * .4, H * alto, 0, 0, 6.2832); cx.fill();
    }
    cx.restore();
  }

  /* --- figuras --- */

  /* Bel de espaldas. escala en fracción de alto de pantalla. */
  function bel(u, vBase, escala, contraluz) {
    var base = Y(vBase), h = H * escala, x = X(u);
    cx.save();
    cx.fillStyle = '#030408';
    cx.beginPath();
    cx.moveTo(x - h * .185, base);
    cx.quadraticCurveTo(x - h * .205, base - h * .42, x - h * .125, base - h * .60);
    cx.quadraticCurveTo(x - h * .098, base - h * .70, x, base - h * .725);
    cx.quadraticCurveTo(x + h * .098, base - h * .70, x + h * .125, base - h * .60);
    cx.quadraticCurveTo(x + h * .205, base - h * .42, x + h * .185, base);
    cx.closePath(); cx.fill();
    cx.beginPath(); cx.arc(x, base - h * .815, h * .090, 0, 6.2832); cx.fill();
    cx.beginPath();
    cx.moveTo(x - h * .088, base - h * .83);
    cx.quadraticCurveTo(x - h * .122, base - h * .70, x - h * .085, base - h * .615);
    cx.quadraticCurveTo(x - h * .052, base - h * .585, x - h * .030, base - h * .612);
    cx.quadraticCurveTo(x, base - h * .632, x + h * .030, base - h * .612);
    cx.quadraticCurveTo(x + h * .052, base - h * .585, x + h * .085, base - h * .615);
    cx.quadraticCurveTo(x + h * .122, base - h * .70, x + h * .088, base - h * .83);
    cx.closePath(); cx.fill();
    cx.save();
    cx.globalAlpha = .5; cx.fillStyle = '#000';
    cx.beginPath(); cx.ellipse(x, base + 2, h * .19, h * .026, 0, 0, 6.2832); cx.fill();
    cx.restore();
    if (luces && contraluz !== false) {
      cx.globalCompositeOperation = 'lighter';
      cx.strokeStyle = 'rgba(255,192,116,.34)'; cx.lineWidth = 1.8;
      cx.beginPath();
      cx.moveTo(x - h * .106, base - h * .60);
      cx.quadraticCurveTo(x, base - h * .705, x + h * .106, base - h * .60);
      cx.stroke();
      cx.strokeStyle = 'rgba(255,192,116,.26)'; cx.lineWidth = 1.5;
      cx.beginPath(); cx.arc(x, base - h * .815, h * .082, -2.6, -.5); cx.stroke();
    }
    cx.restore();
  }

  /* La presencia: una figura que no termina de tener forma.
     intensidad 0 a 1 la hace más definida y más cerca. */
  function presencia(u, vBase, escala, intensidad) {
    var base = Y(vBase), h = H * escala, x = X(u);
    var q = Math.max(0, Math.min(1, intensidad));
    cx.save();
    // Se dibuja como varias siluetas apenas corridas: nunca cierra en un borde.
    for (var c = 0; c < 3; c++) {
      var off = Math.sin(t * 1.3 + c * 2.1) * h * .012 * (1 + c);
      cx.globalAlpha = (c === 0 ? .85 : .28) * (.35 + .65 * q);
      cx.fillStyle = c === 0 ? '#04040a' : '#160d16';
      cx.beginPath();
      cx.moveTo(x - h * .17 + off, base);
      cx.quadraticCurveTo(x - h * .19 + off, base - h * .45, x - h * .10 + off, base - h * .64);
      cx.quadraticCurveTo(x - h * .07 + off, base - h * .74, x + off, base - h * .78);
      cx.quadraticCurveTo(x + h * .07 + off, base - h * .74, x + h * .10 + off, base - h * .64);
      cx.quadraticCurveTo(x + h * .19 + off, base - h * .45, x + h * .17 + off, base);
      cx.closePath(); cx.fill();
      cx.beginPath();
      cx.arc(x + off, base - h * .86, h * .075, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
    // Donde deberían ir los ojos no hay ojos: hay dos huecos más oscuros.
    if (q > .35) {
      cx.fillStyle = 'rgba(0,0,0,' + (.5 * q) + ')';
      cx.beginPath(); cx.ellipse(x - h * .028, base - h * .868, h * .017, h * .026, 0, 0, 6.2832); cx.fill();
      cx.beginPath(); cx.ellipse(x + h * .028, base - h * .868, h * .017, h * .026, 0, 0, 6.2832); cx.fill();
    }
    // Le come la luz alrededor.
    cx.globalCompositeOperation = 'multiply';
    var g = cx.createRadialGradient(x, base - h * .45, 0, x, base - h * .45, h * .55);
    g.addColorStop(0, 'rgba(30,26,38,' + (.55 * q) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, base - h * .45, h * .55, 0, 6.2832); cx.fill();
    cx.restore();
  }

  /* Poste de luz, para poblar el camino. */
  function poste(u, vBase, alto) {
    var x = X(u), base = Y(vBase), al = H * alto;
    cx.save();
    cx.strokeStyle = '#0a0812'; cx.lineWidth = Math.max(2, al * .022);
    cx.beginPath(); cx.moveTo(x, base); cx.lineTo(x, base - al); cx.stroke();
    cx.beginPath();
    cx.moveTo(x, base - al);
    cx.quadraticCurveTo(x + al * .10, base - al * 1.06, x + al * .16, base - al * .99);
    cx.stroke();
    bombita(x + al * .16, base - al * .97, Math.max(2, al * .022), '255,196,120',
      .55 + .45 * Math.sin(t * 1.7 + x));
    if (luces) resplandor(x + al * .16, base - al * .97, al * .5, '255,180,90', .10);
    cx.restore();
  }

  /* Banderines triangulares colgando de un hilo. */
  function banderines(u1, v1, u2, v2, caida) {
    var x1 = X(u1), y1 = Y(v1), x2 = X(u2), y2 = Y(v2);
    cx.save();
    cx.strokeStyle = 'rgba(8,6,16,.9)'; cx.lineWidth = 1.2;
    cx.beginPath(); cx.moveTo(x1, y1);
    cx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + caida, x2, y2);
    cx.stroke();
    var N = Math.max(6, Math.round(Math.abs(x2 - x1) / 44));
    var cols = ['#7d2230', '#4a4a2a', '#2f3a52'];
    for (var i = 0; i < N; i++) {
      var u = (i + .5) / N, iu = 1 - u;
      var x = iu * iu * x1 + 2 * iu * u * ((x1 + x2) / 2) + u * u * x2;
      var y = iu * iu * y1 + 2 * iu * u * ((y1 + y2) / 2 + caida) + u * u * y2;
      var ond = Math.sin(t * 1.6 + i * .8) * 3;
      cx.fillStyle = luces ? cols[i % 3] : '#14111c';
      cx.globalAlpha = luces ? .55 : 1;
      cx.beginPath();
      cx.moveTo(x - 9, y); cx.lineTo(x + 9, y);
      cx.lineTo(x + ond, y + 17); cx.closePath(); cx.fill();
    }
    cx.restore();
  }

  /* Viñeta que se cierra: sube con la tensión de la escena. */
  function vineta(fuerza) {
    var g = cx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * (.78 - .34 * fuerza),
      W / 2, H * .45, Math.max(W, H) * .82);
    g.addColorStop(0, 'rgba(3,4,8,0)');
    g.addColorStop(1, 'rgba(3,4,8,' + (.45 + .45 * fuerza) + ')');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }

  /* Partículas de ceniza o polvo flotando. */
  var motas = [];
  function sembrarMotas(n) {
    motas = [];
    for (var i = 0; i < (n || 40); i++) {
      motas.push({
        x: Math.random(), y: Math.random(),
        v: .004 + Math.random() * .012,
        d: Math.random() * 6.28, r: .6 + Math.random() * 1.4
      });
    }
  }
  function polvo(alfa, tono) {
    cx.save();
    cx.fillStyle = 'rgba(' + (tono || '220,200,170') + ',' + (alfa || .16) + ')';
    motas.forEach(function (m) {
      var y = (m.y - t * m.v) % 1; if (y < 0) y += 1;
      var x = m.x + Math.sin(t * .5 + m.d) * .012;
      cx.beginPath(); cx.arc(X(x), Y(y), m.r, 0, 6.2832); cx.fill();
    });
    cx.restore();
  }

  return {
    usar: usar, X: X, Y: Y, U: U,
    sembrar: sembrar, sembrarMotas: sembrarMotas,
    cielo: cielo, luna: luna,
    bombita: bombita, resplandor: resplandor, guirnalda: guirnalda,
    carpa: carpa, portal: portal, vueltaAlMundo: vueltaAlMundo, calesita: calesita,

/* Bel: el personaje, dibujado y animado con código.

   líneas.

  var ABRIGO_LUZ = '#654472';
  var ABRIGO_OSCURO = '#2c1e35';

  var BUFANDA_OSCURA = '#8e2029';

  function crear(x, y) {

    cx.lineJoin = 'round';

    cx.lineTo(pieX, pieY);

    cx.fill();

    cx.lineTo(manoX, manoY);

    cx.beginPath();

    cx.beginPath();

    cx.fillStyle = PIEL;
    cx.beginPath();
    cx.moveTo(-rCabeza * .08, cabezaY - rCabeza * 1.06);
    cx.quadraticCurveTo(rCabeza * .62, cabezaY - rCabeza * 1.00, rCabeza * .70, cabezaY - rCabeza * .24);
    cx.quadraticCurveTo(rCabeza * .70, cabezaY - rCabeza * .08, rCabeza * .665, cabezaY + rCabeza * .04);
    cx.quadraticCurveTo(rCabeza * .645, cabezaY + rCabeza * .13, rCabeza * .585, cabezaY + rCabeza * .18);

    cx.beginPath();

    cx.quadraticCurveTo(rCabeza * .70, cabezaY - rCabeza * 1.02, rCabeza * .74, cabezaY - rCabeza * .36);
    cx.quadraticCurveTo(rCabeza * .82, cabezaY - rCabeza * .16, rCabeza * .60, cabezaY - rCabeza * .20);
    cx.quadraticCurveTo(rCabeza * .58, cabezaY - rCabeza * .74, rCabeza * .12, cabezaY - rCabeza * .80);

    cx.fillStyle = '#f2e6dc';
    cx.beginPath();
    cx.ellipse(rCabeza * .37, cabezaY - rCabeza * .04, rCabeza * .135, rCabeza * .105, 0, 0, 6.2832); cx.fill();
    cx.fillStyle = '#140c10';

    cx.ellipse(rCabeza * .43, cabezaY - rCabeza * .03, rCabeza * .055, rCabeza * .065, 0, 0, 6.2832); cx.fill();
    cx.fillStyle = LABIO;

    cx.ellipse(rCabeza * .50, cabezaY + rCabeza * .36, rCabeza * .13, rCabeza * .075, -.30, 0, 6.2832); cx.fill();

  return {

/* ===== js/cielo.js ===== */
/* Lo que pasa en el cielo mientras Bel camina.

   Es fondo, no espectáculo: aparece cada tanto, tarda en cruzar, y si la
   jugadora estaba mirando el piso se lo pierde. Esa es la idea — que quien
   mire arriba sea recompensada, no que la escena le grite.

   Nunca hay dos cosas a la vez, y entre una y otra pasan como mínimo veinte
   segundos. */
var Cielo = (function () {
  'use strict';

  var TIPOS = ['fugaz', 'viajera', 'formacion', 'pulso', 'sombra', 'satelite'];

  function crear() {
    return {
      evento: null,
      // La primera aparición llega temprano, para que se note que esto existe.
      espera: 6 + Math.random() * 8,
      vistos: {}
    };
  }

  /* Elige el próximo evento. Las más llamativas salen menos seguido. */
  function elegir(c) {
    var r = Math.random();
    var tipo;
    if (r < .30) tipo = 'fugaz';
    else if (r < .52) tipo = 'satelite';
    else if (r < .70) tipo = 'viajera';
    else if (r < .84) tipo = 'pulso';
    else if (r < .95) tipo = 'formacion';
    else tipo = 'sombra';

    var haciaLaDerecha = Math.random() < .5;
    c.evento = {
      tipo: tipo,
      t: 0,
      dur: tipo === 'fugaz' ? 1.1
         : tipo === 'satelite' ? 14
         : tipo === 'viajera' ? 9
         : tipo === 'pulso' ? 4.5
         : tipo === 'formacion' ? 8
         : 11,                                   // sombra
      dir: haciaLaDerecha ? 1 : -1,
      x0: haciaLaDerecha ? -.12 : 1.12,
      y0: .06 + Math.random() * .30,
      inclina: (Math.random() - .5) * .16,
      semilla: Math.random() * 6.28
    };
    c.vistos[tipo] = (c.vistos[tipo] || 0) + 1;
  }

  function actualizar(c, dt) {
    if (c.evento) {
      c.evento.t += dt;
      if (c.evento.t >= c.evento.dur) {
        c.evento = null;
        c.espera = 20 + Math.random() * 34;
      }
      return;
    }
    c.espera -= dt;
    if (c.espera <= 0) elegir(c);
  }

  /* Curva de aparición y desvanecimiento: entra y sale sin cortes. */
  function sobre(u, subida, bajada) {
    if (u < subida) return u / subida;
    if (u > 1 - bajada) return (1 - u) / bajada;
    return 1;
  }

  function punto(cx, x, y, r, col, alfa) {
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    var g = cx.createRadialGradient(x, y, 0, x, y, r * 7);
    g.addColorStop(0, 'rgba(' + col + ',' + (alfa * .5) + ')');
    g.addColorStop(.4, 'rgba(' + col + ',' + (alfa * .14) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r * 7, 0, 6.2832); cx.fill();
    cx.fillStyle = 'rgba(255,252,244,' + alfa + ')';
    cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill();
    cx.restore();
  }

  function dibujar(cx, c, W, H, t) {
    var e = c.evento;
    if (!e) return;
    var u = e.t / e.dur;

    if (e.tipo === 'fugaz') {
      // Rápida, con estela. Dura poco más de un segundo.
      var a = sobre(u, .12, .40);
      var fx = W * (e.x0 + e.dir * u * 1.24);
      var fy = H * (e.y0 + u * .16);
      var largo = W * .085;
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      var g = cx.createLinearGradient(fx, fy, fx - e.dir * largo, fy - H * .022);
      g.addColorStop(0, 'rgba(255,250,235,' + (.75 * a) + ')');
      g.addColorStop(1, 'rgba(255,250,235,0)');
      cx.strokeStyle = g;
      cx.lineWidth = 2.2;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(fx, fy);
      cx.lineTo(fx - e.dir * largo, fy - H * .022);
      cx.stroke();
      cx.restore();
      punto(cx, fx, fy, 1.6, '255,250,235', .85 * a);

    } else if (e.tipo === 'satelite') {
      // Un puntito parejo que cruza despacio, como un satélite de verdad.
      var a2 = sobre(u, .10, .18);
      var sx = W * (e.x0 + e.dir * u * 1.24);
      var sy = H * (e.y0 + u * e.inclina);
      punto(cx, sx, sy, 1.3, '226,232,255', .55 * a2);

    } else if (e.tipo === 'viajera') {
      // Una luz sola que cruza, cambia de color y se apaga de golpe.
      var a3 = sobre(u, .14, .10);
      var vx = W * (e.x0 + e.dir * u * 1.24);
      var vy = H * (e.y0 + Math.sin(u * 3.1 + e.semilla) * .035);
      var col = u < .5 ? '255,214,150' : '170,225,255';
      // Se apaga y se enciende, sin ritmo fijo.
      var late = .55 + .45 * Math.sin(e.t * 3.2 + e.semilla);
      punto(cx, vx, vy, 2.0, col, .70 * a3 * late);

    } else if (e.tipo === 'formacion') {
      // Tres luces que se mueven juntas, guardando la distancia.
      var a4 = sobre(u, .16, .16);
      var bx = W * (e.x0 + e.dir * u * 1.20);
      var by = H * (e.y0 + Math.sin(u * 2.4 + e.semilla) * .02);
      var sep = W * .028;
      var giro = e.t * .25 + e.semilla;
      for (var i = 0; i < 3; i++) {
        var ang = giro + i * 2.094;
        punto(cx,
          bx + Math.cos(ang) * sep * e.dir,
          by + Math.sin(ang) * sep * .38,
          1.7, '200,235,255', .58 * a4);
      }

    } else if (e.tipo === 'pulso') {
      // Un resplandor que crece y se va, sin nada adentro.
      var a5 = sobre(u, .30, .45);
      var px = W * (.20 + e.semilla * .09);
      var py = H * e.y0;
      var r = H * (.02 + u * .10);
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      var pg = cx.createRadialGradient(px, py, 0, px, py, r);
      pg.addColorStop(0, 'rgba(190,225,255,' + (.16 * a5) + ')');
      pg.addColorStop(.5, 'rgba(160,200,255,' + (.05 * a5) + ')');
      pg.addColorStop(1, 'rgba(160,200,255,0)');
      cx.fillStyle = pg;
      cx.beginPath(); cx.arc(px, py, r, 0, 6.2832); cx.fill();
      cx.restore();

    } else if (e.tipo === 'sombra') {
      // Algo oscuro que pasa por delante de las estrellas y las tapa. No se ve:
      // se nota porque falta cielo.
      var a6 = sobre(u, .22, .22);
      var ox = W * (e.x0 + e.dir * u * 1.24);
      var oy = H * e.y0;
      var an = W * .14, al = H * .045;
      cx.save();
      cx.globalAlpha = .82 * a6;
      cx.fillStyle = '#080b14';
      cx.beginPath();
      cx.ellipse(ox, oy, an, al, e.inclina, 0, 6.2832);
      cx.fill();
      // Un borde apenas más claro, para que no sea un agujero plano.
      cx.globalAlpha = .10 * a6;
      cx.strokeStyle = '#3d4a68';
      cx.lineWidth = 1.5;
      cx.stroke();
      cx.restore();
    }
  }

  /* Para el debug: forzar un evento concreto. */
  function forzar(c, tipo) {
    elegir(c);
    c.evento.tipo = tipo;
    c.evento.t = 0;
    c.evento.dur = tipo === 'fugaz' ? 1.1
      : tipo === 'satelite' ? 14
      : tipo === 'viajera' ? 9
      : tipo === 'pulso' ? 4.5
      : tipo === 'formacion' ? 8 : 11;
  }

  return { crear: crear, actualizar: actualizar, dibujar: dibujar, forzar: forzar, TIPOS: TIPOS };
})();

/* ===== js/mundo.js ===== */
/* El mundo: la feria como un escenario continuo que Bel recorre caminando.
   Las coordenadas del mundo van en píxeles; la cámara traduce a pantalla.
   El suelo está siempre en la misma línea, así que solo hay una dimensión de
   movimiento y las atracciones se ubican por su x. */
var Mundo = (function () {
  'use strict';

  var D = Dib;

  var ANCHO = 8200;          // largo total de la feria
  var SUELO = 0.83;          // altura del piso, en fracción de pantalla
  var VELOCIDAD = 205;       // px por segundo caminando

  /* Las paradas de la feria, de izquierda a derecha.
     radio: a qué distancia se puede interactuar. */
  /* accion: qué dice el prompt. mirar: lo que Bel observa al acercarse.
     Las que tienen secuencia propia la arrancan; el resto responde igual, con
     una observación. E nunca tiene que quedar sin hacer nada. */
  var PARADAS = [
    { clave: 'entrada', x: 240, radio: 150, titulo: 'La entrada', accion: 'mirar el molinete',
      mirar: 'El molinete gira para los dos lados. Los de feria giran para un lado solo, ' +
             'para que nadie entre sin pagar. Este deja pasar en las dos direcciones.' },
    { clave: 'tiro', x: 1080, radio: 170, titulo: 'El puesto de tiro', accion: 'mirar el mostrador',
      mirar: 'Los patos siguen dando la vuelta y las luces están todas sanas. ' +
             'Sobre el mostrador hay dos rifles apoyados, con el caño para adentro. ' +
             'Así los deja alguien que piensa volver.' },
    { clave: 'calesita', x: 2000, radio: 200, titulo: 'La calesita', accion: 'escuchar la música',
      mirar: 'Gira despacio, a la velocidad exacta de los chicos chiquitos. ' +
             'Esa velocidad no viene de fábrica: alguien la reguló así, a mano.' },
    { clave: 'montania', x: 3150, radio: 230, titulo: 'La montaña rusa', accion: 'subirte' },
    { clave: 'chocadores', x: 4300, radio: 200, titulo: 'Los autitos', accion: 'mirar la pista',
      mirar: 'Hay uno andando solo, dando vueltas. Bel busca el tablero y lo encuentra ' +
             'al costado, con la llave abajo. La pista está sin corriente.' },
    { clave: 'espejos', x: 5250, radio: 180, titulo: 'El laberinto de espejos', accion: 'contar los paneles',
      mirar: 'Se ve nueve veces caminando por el frente. Cuenta los paneles despacio, ' +
             'señalando con el dedo: son ocho.' },
    { clave: 'martillo', x: 6000, radio: 140, titulo: 'El martillo', accion: 'mirar la campana',
      mirar: 'La campana está gastada arriba, del lado de adentro. Para dejarla así ' +
             'hay que pegarle muchísimas veces. Y la maza está apoyada, no tirada.' },
    { clave: 'rueda', x: 6850, radio: 230, titulo: 'La vuelta al mundo', accion: 'buscar el motor',
      mirar: 'Rodea la estructura entera. Donde tendría que estar el motor hay un hueco ' +
             'limpio, con la marca en el cemento de cuando estuvo. La rueda sigue girando.' },
    { clave: 'carpa', x: 7800, radio: 170, titulo: 'La carpa del fondo', accion: 'asomarte',
      mirar: 'Es la única sin luces afuera. Abajo de la lona se ve una claridad quieta, ' +
             'de vela. Bel no entra todavía: sabe que a esa carpa se entra al final.' }
  ];

  function crear() {
    return {
      camara: 0,
      ancho: ANCHO,
      paradas: PARADAS,
      // Postes de luz repartidos, para que el camino tenga ritmo.
      postes: (function () {
        var p = [];
        for (var x = 480; x < ANCHO; x += 620) p.push({ x: x, semilla: x * .013 });
        return p;
      })(),
      // Cositas del piso: cajones, un tacho, papeles.
      trastos: (function () {
        var t = [], tipos = ['cajon', 'tacho', 'caballete', 'bolsa'];
        for (var i = 0; i < 26; i++) {
          var x = 380 + i * 300 + ((i * 137) % 190);
          t.push({ x: x, tipo: tipos[i % tipos.length], esc: .8 + ((i * 53) % 40) / 100 });
        }
        return t;
      })()
    };
  }

  /* La cámara sigue a Bel, pero no se sale del mundo y llega con retraso:
     un seguimiento rígido marea. */
  function seguirCamara(m, belX, W, dt) {
    var objetivo = belX - W * .40;
    var max = ANCHO - W;
    if (objetivo < 0) objetivo = 0;
    if (objetivo > max) objetivo = max;
    var k = 1 - Math.pow(0.0025, dt);       // suavizado independiente de los fps
    m.camara += (objetivo - m.camara) * k;
  }

  function paradaCerca(m, belX) {
    for (var i = 0; i < PARADAS.length; i++) {
      if (Math.abs(belX - PARADAS[i].x) < PARADAS[i].radio) return PARADAS[i];
    }
    return null;
  }

  /* --- fondo --- */

  // Tres capas de siluetas lejanas que se mueven a distinta velocidad.
  function fondo(cx, m, W, H, t, luna) {
    // Se pinta bien por fuera de la pantalla: durante las secuencias la cámara
    // sube, y un rectángulo del alto justo dejaba franjas negras.
    var g = cx.createLinearGradient(0, -H, 0, H);
    g.addColorStop(0, '#060811');
    g.addColorStop(.28, '#0a0e1a');
    g.addColorStop(.60, '#121a2e');
    g.addColorStop(.86, '#1d2340');
    g.addColorStop(1, '#0f1220');
    cx.fillStyle = g;
    cx.fillRect(-W, -H * 1.6, W * 3, H * 3.2);

    D.usar(cx, W, H, t, true);
    // Estrellas y luna quedan fijas: están lejísimos.
    cx.save();
    for (var i = 0; i < estrellas.length; i++) {
      var e = estrellas[i];
      cx.globalAlpha = .18 + .45 * (0.5 + 0.5 * Math.sin(t * e.v + e.f));
      cx.fillStyle = '#cfd6ee';
      cx.beginPath(); cx.arc(e.x * W, e.y * H * .62, e.r, 0, 6.2832); cx.fill();
    }
    cx.restore();
    D.luna(.82, .15, .026, luna.iluminacion, luna.creciente);

    // Capa 1: el paredón del baldío y los árboles del fondo.
    var c1 = m.camara * .18;
    cx.fillStyle = '#0d1120';
    var yPared = H * SUELO - H * .17;
    cx.fillRect(0, yPared, W, H * .17);
    for (var k = 0; k < 30; k++) {
      var ax = (k * 340 - c1) % (W + 680) - 340;
      cx.beginPath();
      cx.ellipse(ax, yPared - H * .012, 46, H * .052, 0, 0, 6.2832);
      cx.fill();
    }

    // Capa 2: siluetas de carpas y mástiles, a media distancia.
    var c2 = m.camara * .42;
    cx.fillStyle = '#111527';
    for (var j = 0; j < 22; j++) {
      var bx = (j * 430 - c2) % (W + 860) - 430;
      var alto = H * (.06 + ((j * 37) % 40) / 900);
      cx.beginPath();
      cx.moveTo(bx - 62, H * SUELO - H * .015);
      cx.quadraticCurveTo(bx, H * SUELO - H * .015 - alto * 1.5, bx + 62, H * SUELO - H * .015);
      cx.closePath(); cx.fill();
    }
  }

  var estrellas = [];
  function sembrar() {
    estrellas = [];
    for (var i = 0; i < 150; i++) {
      estrellas.push({
        x: Math.random(), y: Math.random(),
        r: Math.random() * 1.1 + .3, f: Math.random() * 6.28,
        v: .4 + Math.random() * 1.0
      });
    }
  }

  /* --- suelo --- */

  function suelo(cx, m, W, H, t) {
    var y = H * SUELO;
    var g = cx.createLinearGradient(0, y - 4, 0, H);
    g.addColorStop(0, '#1e1a2a');
    g.addColorStop(.25, '#16121f');
    g.addColorStop(1, '#0a0810');
    cx.fillStyle = g;
    cx.fillRect(-W, y - 4, W * 3, H * 1.8);

    // Pedregullo: puntitos que se mueven con la cámara, para que se note el avance.
    cx.save();
    cx.fillStyle = 'rgba(150,140,165,.14)';
    var paso = 26;
    var off = -(m.camara % paso);
    for (var fila = 0; fila < 7; fila++) {
      var fy = y + 10 + fila * (H - y) * .12;
      var desfase = (fila % 2) * (paso / 2);
      for (var x = off - paso; x < W + paso; x += paso) {
        var r = 1 + ((Math.round(x + m.camara + fila * 71) * 13) % 5) * .28;
        cx.beginPath();
        cx.arc(x + desfase, fy, r, 0, 6.2832);
        cx.fill();
      }
    }
    cx.restore();
  }

  /* --- trastos del piso --- */

  function trastos(cx, m, W, H, t) {
    var y = H * SUELO;
    m.trastos.forEach(function (o) {
      var x = o.x - m.camara;
      if (x < -120 || x > W + 120) return;
      var s = o.esc;
      cx.save();
      cx.translate(x, y);
      cx.fillStyle = 'rgba(0,0,0,.4)';
      cx.beginPath(); cx.ellipse(0, 3, 26 * s, 6 * s, 0, 0, 6.2832); cx.fill();
      if (o.tipo === 'cajon') {
        cx.fillStyle = '#1c1520';
        cx.fillRect(-20 * s, -26 * s, 40 * s, 26 * s);
        cx.strokeStyle = '#2b2130'; cx.lineWidth = 2;
        cx.strokeRect(-20 * s, -26 * s, 40 * s, 26 * s);
        cx.beginPath();
        cx.moveTo(-20 * s, -13 * s); cx.lineTo(20 * s, -13 * s); cx.stroke();
      } else if (o.tipo === 'tacho') {
        cx.fillStyle = '#191420';
        cx.beginPath();
        cx.moveTo(-15 * s, 0); cx.lineTo(-12 * s, -34 * s);
        cx.lineTo(12 * s, -34 * s); cx.lineTo(15 * s, 0);
        cx.closePath(); cx.fill();
        cx.fillStyle = '#241d2c';
        cx.beginPath(); cx.ellipse(0, -34 * s, 12 * s, 4 * s, 0, 0, 6.2832); cx.fill();
      } else if (o.tipo === 'caballete') {
        cx.strokeStyle = '#1e1826'; cx.lineWidth = 3 * s;
        cx.beginPath();
        cx.moveTo(-18 * s, 0); cx.lineTo(-6 * s, -22 * s);
        cx.moveTo(18 * s, 0); cx.lineTo(6 * s, -22 * s);
        cx.moveTo(-14 * s, -22 * s); cx.lineTo(14 * s, -22 * s);
        cx.stroke();
      } else {
        cx.fillStyle = '#15111c';
        cx.beginPath();
        cx.ellipse(0, -7 * s, 17 * s, 8 * s, .2, 0, 6.2832); cx.fill();
      }

  /* --- postes de luz --- */

  function postes(cx, m, W, H, t) {
    var y = H * SUELO;
    m.postes.forEach(function (p) {
      var x = p.x - m.camara;
      if (x < -140 || x > W + 140) return;
      var al = H * .30;
      cx.save();
      cx.strokeStyle = '#0d0a14';
      cx.lineWidth = 5;
      cx.beginPath();
      cx.moveTo(x, y); cx.lineTo(x, y - al); cx.stroke();
      cx.beginPath();
      cx.moveTo(x, y - al);
      cx.quadraticCurveTo(x + al * .10, y - al * 1.07, x + al * .17, y - al * .99);
      cx.stroke();
      cx.restore();

      // Alguno falla, como en toda feria.

        D.resplandor(x + al * .17, y - al * .97, al * .62, '255,178,96', .10 * late);

        gg.addColorStop(1, 'rgba(255,180,96,0)');

        cx.ellipse(x + al * .17, y + 6, al * .50, al * .085, 0, 0, 6.2832);

  /* Guirnaldas que cruzan de poste a poste. */
  function guirnaldas(cx, m, W, H, t) {
    var y = H * SUELO;
    var al = H * .30;
    for (var i = 0; i < m.postes.length - 1; i++) {
      var a = m.postes[i], b = m.postes[i + 1];
      var x1 = a.x - m.camara + al * .17, x2 = b.x - m.camara + al * .17;

      cx.moveTo(x1, y1);
      cx.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 + 54, x2, y2);
      cx.stroke();
      cx.restore();

      for (var k = 1; k < N; k++) {
        var u = k / N, iu = 1 - u;
        var bx = iu * iu * x1 + 2 * iu * u * ((x1 + x2) / 2) + u * u * x2;
        var by = iu * iu * y1 + 2 * iu * u * ((y1 + y2) / 2 + 54) + u * u * y2;
        if (Math.sin(t * 2 + k * 1.1 + i * 3) < -.82) continue;
        var col = (k % 3 === 0) ? '255,196,128' : (k % 3 === 1) ? '196,110,116' : '150,196,176';

  return {
    ANCHO: ANCHO, SUELO: SUELO, VELOCIDAD: VELOCIDAD, PARADAS: PARADAS,
    crear: crear, sembrar: sembrar, seguirCamara: seguirCamara,
