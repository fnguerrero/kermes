})();

/* ===== js/atracciones.js ===== */
/* Las atracciones dibujadas dentro del mundo.
   Cada una recibe la x de pantalla (ya restada la cámara) y la línea del piso,
   así se dibujan siempre a la misma escala y el recorrido se siente continuo. */
var Atracciones = (function () {
  'use strict';

  var D = Dib;

  var HIERRO = '#171325';
  var HIERRO_LUZ = '#2a2340';
  var LONA_A = '#3a2536';
  var LONA_B = '#513349';

  /* --- entrada: molinete y cartel --- */
  function entrada(cx, x, piso, H, t) {
    var an = H * .42, al = H * .46;
    cx.save();
    // Columnas.
    cx.fillStyle = HIERRO;
    cx.fillRect(x - an / 2, piso - al, an * .07, al);
    cx.fillRect(x + an / 2 - an * .07, piso - al, an * .07, al);
    // Arco.
    cx.beginPath();
    cx.moveTo(x - an / 2, piso - al);
    cx.quadraticCurveTo(x, piso - al * 1.42, x + an / 2, piso - al);
    cx.lineTo(x + an / 2, piso - al * .90);
    cx.quadraticCurveTo(x, piso - al * 1.28, x - an / 2, piso - al * .90);
    cx.closePath(); cx.fill();
    // Bombitas del arco.
    for (var i = 0; i <= 15; i++) {
      var u = i / 15, iu = 1 - u;
      var bx = iu * iu * (x - an / 2) + 2 * iu * u * x + u * u * (x + an / 2);
      var by = iu * iu * (piso - al) + 2 * iu * u * (piso - al * 1.35) + u * u * (piso - al);
      if (i === 6 && Math.sin(t * 7) < 0) continue;
      D.bombita(bx, by, 2.4, '255,206,140', .55 + .45 * Math.sin(t * 2.4 + i * .7));
    }
    // Rótulo.
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    // Letras de neón sobre el arco: entran dentro del ancho del portal, con
    // el espaciado justo. Antes se desbordaban por los dos lados.
    var cuerpo = Math.min(al * .115, an * .155);
    cx.font = '600 ' + Math.round(cuerpo) + "px 'Cormorant Garamond',serif";
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.shadowColor = 'rgba(255,168,64,.9)'; cx.shadowBlur = 20;
    cx.fillStyle = 'rgba(255,208,132,.95)';
    cx.fillText('KERMÉS', x, piso - al * 1.13);
    cx.restore();
    // Molinete.
    cx.strokeStyle = HIERRO_LUZ; cx.lineWidth = 5;
    cx.beginPath();
    cx.moveTo(x + an * .18, piso); cx.lineTo(x + an * .18, piso - H * .085);
    cx.stroke();
    var giro = Math.sin(t * .3) * .25;
    for (var b = 0; b < 3; b++) {
      var a = giro + b * 2.094;
      cx.beginPath();
      cx.moveTo(x + an * .18, piso - H * .075);
      cx.lineTo(x + an * .18 + Math.cos(a) * H * .052, piso - H * .075 + Math.sin(a) * H * .014);
      cx.stroke();
    }
    cx.restore();
  }

  /* --- puesto de tiro --- */
  function tiro(cx, x, piso, H, t) {
    var an = H * .46, al = H * .42;
    var x0 = x - an / 2, x1 = x + an / 2, techo = piso - al, most = piso - al * .32;
    cx.save();
    cx.fillStyle = HIERRO;
    cx.fillRect(x0, techo, an, al);
    var g = cx.createLinearGradient(0, techo + al * .10, 0, most);
    g.addColorStop(0, 'rgba(255,186,96,.34)');
    g.addColorStop(1, 'rgba(150,60,60,.12)');
    cx.fillStyle = g;
    cx.fillRect(x0 + an * .06, techo + al * .10, an * .88, most - techo - al * .10);
    // Patos en dos hileras.
    for (var f = 0; f < 2; f++) {
      var yf = techo + al * .22 + f * al * .20;
      var dir = f === 0 ? 1 : -1;
      cx.save();
      cx.beginPath(); cx.rect(x0 + an * .07, techo + al * .10, an * .86, most - techo - al * .12); cx.clip();
      var paso = an * .26;
      for (var i = -1; i < 5; i++) {
        var px = x0 + an * .07 + i * paso + ((t * 26 * dir) % paso + paso) % paso;
        cx.save(); cx.translate(px, yf);
        if (dir < 0) cx.scale(-1, 1);
        cx.fillStyle = '#0b0810';
        cx.beginPath(); cx.ellipse(0, 0, an * .052, an * .028, 0, 0, 6.2832); cx.fill();
        cx.beginPath(); cx.ellipse(an * .032, -an * .034, an * .020, an * .022, 0, 0, 6.2832); cx.fill();
        cx.beginPath();
        cx.moveTo(an * .050, -an * .038); cx.lineTo(an * .076, -an * .030);
        cx.lineTo(an * .050, -an * .024); cx.closePath(); cx.fill();
        cx.restore();
      }
      cx.restore();
    }
    // Mostrador y alero.
    cx.fillStyle = '#120e1a';
    cx.fillRect(x0, most, an, al * .09);
    cx.fillStyle = HIERRO;
    cx.fillRect(x0 - an * .05, techo - al * .05, an * 1.10, al * .055);
    for (var k = 0; k <= 9; k++)
      D.bombita(x0 - an * .05 + an * 1.10 * k / 9, techo - al * .06, 2.3, '255,200,130',
        .5 + .5 * Math.sin(t * 2.6 + k * .8));
    D.resplandor(x, techo + al * .3, an * .8, '255,170,90', .10);
    cx.restore();
    D.cartel(x, techo - al * .22, 'TIRO AL BLANCO',
      { ancho: H * .30, color: '#7a4030', tinta: '#ffe2bc' });
  }

  /* --- calesita --- */
  function calesita(cx, x, piso, H, t) {
    var an = H * .62, al = H * .46;
    cx.save();
    cx.fillStyle = '#0c0912';
    cx.beginPath(); cx.ellipse(x, piso, an * .5, an * .085, 0, 0, 6.2832); cx.fill();
    var giro = t * .34;
    var N = 8, piezas = [];
    for (var i = 0; i < N; i++) piezas.push({ a: giro + i * 6.2832 / N });
    piezas.sort(function (p, q) { return Math.sin(p.a) - Math.sin(q.a); });
    piezas.forEach(function (p) {
      var px = x + Math.cos(p.a) * an * .40;
      var py = piso + Math.sin(p.a) * an * .072;
      var sube = Math.sin(t * 2.2 + p.a * 2) * al * .05;
      cx.strokeStyle = '#1d1729'; cx.lineWidth = Math.max(1.5, an * .008);
      cx.beginPath(); cx.moveTo(px, py); cx.lineTo(px, py - al * .68); cx.stroke();
      var cy = py - al * .30 + sube, cw = an * .072, ch = al * .10;
      cx.fillStyle = '#100c19';
      cx.beginPath(); cx.ellipse(px, cy, cw, ch * .55, 0, 0, 6.2832); cx.fill();
      cx.beginPath();
      cx.moveTo(px + cw * .55, cy - ch * .2);
      cx.lineTo(px + cw * 1.05, cy - ch * .95);
      cx.lineTo(px + cw * .70, cy - ch * 1.0);
      cx.lineTo(px + cw * .28, cy - ch * .35);
      cx.closePath(); cx.fill();
      cx.strokeStyle = '#100c19'; cx.lineWidth = Math.max(1.2, an * .007);
      [-.5, -.15, .2, .55].forEach(function (o) {
        cx.beginPath();
        cx.moveTo(px + cw * o, cy + ch * .35);
        cx.lineTo(px + cw * o + cw * .12, cy + ch * .95);
        cx.stroke();
      });
    });
    // Techo cónico.
    for (var j = 0; j < 12; j++) {
      var a0 = j / 12 * 6.2832, a1 = (j + 1) / 12 * 6.2832;
      cx.fillStyle = (j % 2 === 0) ? LONA_B : LONA_A;
      cx.beginPath();
      cx.moveTo(x, piso - al * 1.06);
      cx.lineTo(x + Math.cos(a0) * an * .52, piso - al * .72 + Math.sin(a0) * an * .09);
      cx.lineTo(x + Math.cos(a1) * an * .52, piso - al * .72 + Math.sin(a1) * an * .09);
      cx.closePath(); cx.fill();
    }
    for (var b = 0; b < 16; b++) {
      var ab = b / 16 * 6.2832;
      if (Math.sin(ab) < -.5) continue;
      D.bombita(x + Math.cos(ab) * an * .52, piso - al * .72 + Math.sin(ab) * an * .09,
        2.1, '255,204,140', .5 + .5 * Math.sin(t * 3 + b));
    }
    D.resplandor(x, piso - al * .45, an * .75, '255,190,110', .11);
    cx.restore();
    D.carteliPie(x - an * .62, piso, 'CALESITA',
      { ancho: H * .17, color: '#8a5a2e', tinta: '#ffe8c0' });
  }

  /* --- montaña rusa: la estructura de madera y el circuito --- */
  function montania(cx, x, piso, H, t) {
    var an = H * 2.10, al = H * .66;
    cx.save();
    // Perfil del circuito: subida larga, caída, dos lomas.
    var pts = perfilMontania(x, piso, an, al);
    // Columnas de sostén.
    cx.strokeStyle = HIERRO; cx.lineWidth = 4;
    for (var i = 0; i < pts.length; i += 3) {
      cx.beginPath();
      cx.moveTo(pts[i].x, pts[i].y);
      cx.lineTo(pts[i].x, piso);
      cx.stroke();
      // Cruces de arriostre.
      if (i + 3 < pts.length) {
        cx.beginPath();
        cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[i + 3].x, piso);
        cx.moveTo(pts[i + 3].x, pts[i + 3].y); cx.lineTo(pts[i].x, piso);
        cx.stroke();
      }
    }
    // Vía.
    cx.strokeStyle = '#241c30'; cx.lineWidth = 7;
    cx.beginPath();
    cx.moveTo(pts[0].x, pts[0].y);
    for (var k = 1; k < pts.length; k++) cx.lineTo(pts[k].x, pts[k].y);
    cx.stroke();
    cx.strokeStyle = '#3a2f4a'; cx.lineWidth = 2.5;
    cx.beginPath();
    cx.moveTo(pts[0].x, pts[0].y - 6);
    for (var k2 = 1; k2 < pts.length; k2++) cx.lineTo(pts[k2].x, pts[k2].y - 6);
    cx.stroke();
    // Luces sobre la estructura.
    for (var b = 0; b < pts.length; b += 4) {
      if (Math.sin(t * 2 + b) < -.6) continue;
      D.bombita(pts[b].x, pts[b].y - 10, 2, '255,186,120', .5 + .5 * Math.sin(t * 2.6 + b));
    }
    cx.restore();
    // Cartel colgado del armazón, a la altura de la subida.
    D.cartel(x - an * .30, piso - al * 1.02, 'LA RUSA',
      { ancho: H * .30, color: '#7d4a2c', tinta: '#ffe0b4', colorLuz: '255,180,110' });
  }

  /* Perfil del circuito, compartido por el dibujo y por la secuencia.
     Subida larga, caída, y tres lomas cada vez más bajas: es el recorrido
     clásico y da un ritmo que se siente bien sin retocar nada a mano. */
  function perfilMontania(x, piso, an, al) {
    var x0 = x - an * .48;
    var pts = [];
    var N = 90;
    for (var i = 0; i <= N; i++) {
      var u = i / N;
      var px = x0 + an * u;
      var h;
      if (u < .020) {
        h = al * .035;                                          // estación
      } else if (u < .300) {
        var a0 = (u - .020) / .280;
        h = al * (.035 + a0 * .965);                            // la cadena
      } else if (u < .400) {
        var v = (u - .300) / .100;
        h = al * (1 - v * v * .93);                             // la caída
      } else if (u < .560) {
        var w = (u - .400) / .160;
        h = al * (.07 + Math.sin(w * Math.PI) * .46);           // loma grande
      } else if (u < .700) {
        var z = (u - .560) / .140;
        h = al * (.07 + Math.sin(z * Math.PI) * .30);           // loma media
      } else if (u < .830) {
        var y2 = (u - .700) / .130;
        h = al * (.06 + Math.sin(y2 * Math.PI) * .17);          // loma chica
      } else {
        h = al * .045;                                          // llegada
      }
      pts.push({ x: px, y: piso - h - al * .03, u: u });
    }
    return pts;
  }

  /* --- autitos chocadores --- */
  function chocadores(cx, x, piso, H, t) {
    var an = H * .78, al = H * .50;
    var x0 = x - an / 2, x1 = x + an / 2;
    cx.save();

    // Techo del galpón, a dos aguas, y su estructura.
    cx.fillStyle = HIERRO;
    cx.beginPath();
    cx.moveTo(x0 - an * .04, piso - al);
    cx.lineTo(x, piso - al * 1.20);
    cx.lineTo(x1 + an * .04, piso - al);
    cx.lineTo(x1 + an * .04, piso - al * .93);
    cx.lineTo(x, piso - al * 1.12);
    cx.lineTo(x0 - an * .04, piso - al * .93);
    cx.closePath(); cx.fill();

    // Columnas.
    cx.fillStyle = HIERRO;
    [-1, 1].forEach(function (l) {
      cx.fillRect(x + l * an / 2 - an * .012, piso - al, an * .024, al);
    });

    // El fondo del galpón, iluminado en verde: es lo que lo hace visible de lejos.
    var g = cx.createLinearGradient(0, piso - al * .92, 0, piso - al * .10);
    g.addColorStop(0, 'rgba(70,150,110,.20)');
    g.addColorStop(1, 'rgba(40,110,80,.06)');
    cx.fillStyle = g;
    cx.fillRect(x0, piso - al * .92, an, al * .82);

    // Malla del techo.
    cx.strokeStyle = 'rgba(40,70,55,.75)'; cx.lineWidth = 1.2;
    for (var i = 0; i <= 14; i++) {
      var px = x0 + an * i / 14;
      cx.beginPath(); cx.moveTo(px, piso - al * .93); cx.lineTo(px, piso - al * .62); cx.stroke();
    }
    for (var j = 0; j < 3; j++) {
      var jy = piso - al * (.93 - j * .105);
      cx.beginPath(); cx.moveTo(x0, jy); cx.lineTo(x1, jy); cx.stroke();
    }

    // Pista: piso pulido con reflejo.
    var pg = cx.createLinearGradient(0, piso - al * .30, 0, piso);
    pg.addColorStop(0, '#16241c');
    pg.addColorStop(1, '#0a1210');
    cx.fillStyle = pg;
    cx.fillRect(x0, piso - al * .30, an, al * .30);
    // Baranda con tubos de neón.
    cx.fillStyle = '#0d1712';
    cx.fillRect(x0, piso - al * .34, an, al * .05);
    cx.restore();
    for (var n = 0; n <= 12; n++)
      D.bombita(x0 + an * n / 12, piso - al * .335, 2.4, '150,240,190',
        .5 + .45 * Math.sin(t * 2 + n));

    // Cartel colgado del frente del galpón.
    D.cartel(x, piso - al * 1.16, 'CHOCADORES',
      { ancho: H * .34, color: '#3f5a44', tinta: '#d8f5e4', colorLuz: '150,240,190' });

    // Cuatro autitos: tres parados y uno dando vueltas.
    autito(cx, x - an * .30, piso - al * .16, an * .075, .28, false, t);
    autito(cx, x + an * .10, piso - al * .09, an * .085, -.5, false, t);
    autito(cx, x + an * .33, piso - al * .20, an * .070, 1.9, false, t);
    var u = (t * .16) % 1;
    autito(cx, x - an * .34 + an * .68 * u, piso - al * .22 + Math.sin(u * 6.28) * al * .07,
      an * .080, Math.sin(u * 6.28) * .45, true, t);

    D.resplandor(x, piso - al * .45, an * .55, '90,200,145', .12);
  }

  function autito(cx, x, y, an, giro, vivo, t) {
    cx.save();
    cx.translate(x, y); cx.rotate(giro);
    cx.fillStyle = 'rgba(0,0,0,.4)';
    cx.beginPath(); cx.ellipse(0, an * .3, an * 1.05, an * .3, 0, 0, 6.2832); cx.fill();
    cx.fillStyle = vivo ? '#2a1524' : '#0e0c14';
    cx.beginPath(); cx.ellipse(0, an * .1, an, an * .42, 0, 0, 6.2832); cx.fill();
    cx.fillStyle = vivo ? '#1a1018' : '#09080e';
    cx.beginPath(); cx.ellipse(0, -an * .05, an * .8, an * .34, 0, 0, 6.2832); cx.fill();
    cx.fillStyle = '#05050a';
    cx.beginPath();
    cx.moveTo(-an * .34, -an * .1); cx.lineTo(-an * .3, -an * .68);
    cx.lineTo(an * .16, -an * .68); cx.lineTo(an * .2, -an * .1);
    cx.closePath(); cx.fill();
    cx.restore();
    if (vivo) {
      if (Math.sin(t * 8.5) > .74) D.bombita(x, y - an * 2.2, 2.6, '190,255,215', 1);
      D.resplandor(x, y, an * 3, '110,210,160', .09);
    }
  }

  /* --- laberinto de espejos --- */
  function espejos(cx, x, piso, H, t) {
    var an = H * .56, al = H * .46;
    var x0 = x - an / 2;
    cx.save();
    var n = 7, pa = an / n;
    for (var i = 0; i < n; i++) {
      var px = x0 + i * pa;
      var brillo = .05 + .12 * (0.5 + 0.5 * Math.sin(t * .7 + i * 1.4));
      var g = cx.createLinearGradient(px, piso - al, px + pa, piso);
      g.addColorStop(0, 'rgba(160,168,215,' + brillo + ')');
      g.addColorStop(.5, 'rgba(42,38,68,.6)');
      g.addColorStop(1, 'rgba(126,134,185,' + (brillo * .6) + ')');
      cx.fillStyle = g;
      cx.fillRect(px + 2, piso - al, pa - 4, al);
      cx.strokeStyle = HIERRO; cx.lineWidth = 3;
      cx.strokeRect(px + 2, piso - al, pa - 4, al);
    }
    // Marquesina.
    cx.fillStyle = HIERRO;
    cx.beginPath();
    cx.moveTo(x0 - an * .05, piso - al);
    cx.lineTo(x, piso - al * 1.22);
    cx.lineTo(x0 + an + an * .05, piso - al);
    cx.closePath(); cx.fill();
    for (var b = 0; b <= 10; b++) {
      var u = b / 10;
      var bx = x0 - an * .05 + (an + an * .1) * u;
      var by = piso - al - al * .22 * (1 - Math.abs(u - .5) * 2);
      D.bombita(bx, by, 2, '176,158,235', .5 + .5 * Math.sin(t * 2 + b));
    }
    cx.restore();
    D.cartel(x, piso - al * 1.30, 'ESPEJOS',
      { ancho: H * .24, color: '#4a3f6e', tinta: '#ddd6ff', colorLuz: '176,158,235' });
  }

  /* --- martillo de fuerza --- */
  function martillo(cx, x, piso, H, t) {
    var al = H * .62, an = H * .13;
    cx.save();
    // Riel con marcas y números.
    cx.fillStyle = HIERRO;
    cx.fillRect(x - an * .16, piso - al, an * .32, al);
    cx.fillStyle = HIERRO_LUZ;
    cx.fillRect(x - an * .07, piso - al, an * .14, al);
    cx.strokeStyle = '#41345a'; cx.lineWidth = 2.5;
    for (var i = 1; i < 12; i++) {
      var y = piso - al * i / 12;
      cx.beginPath();
      cx.moveTo(x - an * .30, y); cx.lineTo(x - an * .16, y);
      cx.stroke();
      if (i % 3 === 0)
        D.bombita(x + an * .26, y, 2, '255,150,110', .45 + .4 * Math.sin(t * 2.4 + i));
    }
    // Campana arriba.
    cx.fillStyle = '#7d6330';
    cx.beginPath();
    cx.moveTo(x - an * .40, piso - al);
    cx.quadraticCurveTo(x, piso - al - an * .58, x + an * .40, piso - al);
    cx.closePath(); cx.fill();
    cx.fillStyle = '#a88544';
    cx.beginPath();
    cx.ellipse(x, piso - al, an * .40, an * .07, 0, 0, 6.2832);
    cx.fill();
    D.resplandor(x, piso - al - an * .25, an * 2.2, '255,196,110', .16);

    // Base y maza apoyada.
    cx.fillStyle = '#1b1526';
    cx.fillRect(x - an * .62, piso - an * .30, an * 1.24, an * .30);
    cx.fillStyle = '#2a2138';
    cx.fillRect(x - an * .62, piso - an * .34, an * 1.24, an * .07);
    cx.strokeStyle = '#3a2f4a'; cx.lineWidth = an * .10;
    cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(x + an * .52, piso - an * .08);
    cx.lineTo(x + an * .90, piso - an * .82);
    cx.stroke();
    cx.fillStyle = '#332a44';
    cx.save();
    cx.translate(x + an * .93, piso - an * .90);
    cx.rotate(-.45);
    cx.fillRect(-an * .16, -an * .13, an * .32, an * .26);
    cx.restore();

    cx.restore();
    D.cartel(x, piso - al - an * 1.10, 'PROBÁ TU FUERZA',
      { ancho: H * .28, alto: H * .075, color: '#6e4630', tinta: '#ffd9a8', cuerpo: H * .030 });
  }

  /* --- vuelta al mundo --- */
  function rueda(cx, x, piso, H, t) {
    var R = H * .40;
    var cy = piso - R * 1.18;
    cx.save();
    cx.strokeStyle = HIERRO; cx.lineWidth = Math.max(2, R * .028);
    cx.beginPath(); cx.arc(x, cy, R, 0, 6.2832); cx.stroke();
    cx.beginPath(); cx.arc(x, cy, R * .92, 0, 6.2832); cx.stroke();
    var giro = t * .10, N = 16;
    for (var i = 0; i < N; i++) {
      var a = giro + i * 6.2832 / N;
      var px = x + Math.cos(a) * R, py = cy + Math.sin(a) * R;
      cx.strokeStyle = HIERRO; cx.lineWidth = Math.max(1.2, R * .014);
      cx.beginPath(); cx.moveTo(x, cy); cx.lineTo(px, py); cx.stroke();
      var cb = R * .07;
      cx.fillStyle = HIERRO; cx.fillRect(px - cb / 2, py, cb, cb * 1.3);
      if (Math.sin(t * 1.5 + i * 1.7) > -.55)
        D.bombita(px, py, Math.max(1.3, R * .014), '255,198,120', .5 + .5 * Math.sin(t * 2.6 + i));
    }
    cx.strokeStyle = HIERRO; cx.lineWidth = Math.max(2.5, R * .045);
    cx.beginPath();
    cx.moveTo(x - R * .44, piso); cx.lineTo(x, cy);
    cx.lineTo(x + R * .44, piso); cx.stroke();
    cx.beginPath();
    cx.moveTo(x - R * .28, cy + R * .82); cx.lineTo(x + R * .28, cy + R * .82); cx.stroke();
    cx.restore();
    D.carteliPie(x - R * .95, piso, 'VUELTA AL MUNDO',
      { ancho: H * .20, alto: H * .052, color: '#6b4a55', tinta: '#ffdcc8', cuerpo: H * .022 });
  }

  /* --- carpa del fondo --- */
  function carpa(cx, x, piso, H, t) {
    var an = H * .46, al = H * .42;
    cx.save();
    var cima = piso - al * 1.24, hombro = piso - al * .42;
    for (var i = 0; i < 9; i++) {
      var u0 = i / 9, u1 = (i + 1) / 9;
      cx.fillStyle = (i % 2 === 0) ? LONA_A : LONA_B;
      cx.beginPath();
      cx.moveTo(x, cima);
      cx.lineTo(x - an / 2 + an * u0, hombro + Math.pow(Math.abs(u0 - .5) * 2, 2) * al * .14);
      cx.lineTo(x - an / 2 + an * u1, hombro + Math.pow(Math.abs(u1 - .5) * 2, 2) * al * .14);
      cx.closePath(); cx.fill();
    }
    cx.fillStyle = LONA_A;
    cx.fillRect(x - an / 2, hombro + al * .14, an, piso - hombro - al * .14);
    // Boca iluminada: es la única luz de esta punta de la feria.
    var g = cx.createLinearGradient(x, hombro, x, piso);
    g.addColorStop(0, 'rgba(255,176,86,.5)');
    g.addColorStop(1, 'rgba(170,60,60,.12)');
    cx.fillStyle = g;
    cx.beginPath();
    cx.moveTo(x - an * .15, piso); cx.lineTo(x - an * .12, hombro + al * .06);
    cx.quadraticCurveTo(x, hombro - al * .02, x + an * .12, hombro + al * .06);
    cx.lineTo(x + an * .15, piso); cx.closePath(); cx.fill();
    D.resplandor(x, piso - al * .2, an * .7, '255,170,90', .12);
    // Banderín.
    cx.strokeStyle = HIERRO; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x, cima); cx.lineTo(x, cima - al * .16); cx.stroke();
    cx.fillStyle = '#a8323f';
    var on = Math.sin(t * 2.2) * 3;
    cx.beginPath();
    cx.moveTo(x, cima - al * .16); cx.lineTo(x + 14 + on, cima - al * .11);
    cx.lineTo(x, cima - al * .06); cx.closePath(); cx.fill();
    cx.restore();
  }

  var DIBUJOS = {
    entrada: entrada, tiro: tiro, calesita: calesita, montania: montania,
    chocadores: chocadores, espejos: espejos, martillo: martillo,
    rueda: rueda, carpa: carpa
  };

  function dibujar(clave, cx, x, piso, H, t) {
    var f = DIBUJOS[clave];
    if (f) f(cx, x, piso, H, t);
  }

  return { dibujar: dibujar, DIBUJOS: DIBUJOS, perfilMontania: perfilMontania };
})();

/* ===== js/secuencias.js ===== */
/* Secuencias: los momentos en que el juego toma el control.

   Mientras corre una secuencia, Bel deja de responder a las flechas y la cámara
   se despega de ella para seguir lo que importe. Cada secuencia es una lista de
   fases con su duración; el motor avanza sola y llama a pintar() con el
   progreso, así el dibujo no tiene que llevar la cuenta del tiempo. */
var Secuencias = (function () {
  'use strict';

  var A = Atracciones;
  var B = Bel;
  var D = Dib;

  /* ============ motor ============ */

  function iniciar(clave, ctx) {
    var def = DEFS[clave];
    if (!def) return null;
    return {
      clave: clave,
      def: def,
      fase: 0,
      t: 0,
      total: 0,
      datos: def.arranque ? def.arranque(ctx) : {},
      terminada: false
    };
  }

  function avanzar(s, dt, ctx) {
    if (!s || s.terminada) return;
    s.t += dt;
    s.total += dt;
    var f = s.def.fases[s.fase];
    // Algunas fases no terminan por reloj sino cuando el carro llegó a destino.
    var cumplida = f.hasta ? f.hasta(s, ctx) : false;
    if (cumplida || s.t >= f.dur) {
      // Si terminó por condición, el reloj arranca de cero: restar la duración
      // completa dejaba un sobrante negativo que estiraba la fase siguiente.
      s.t = cumplida ? 0 : s.t - f.dur;
      s.fase++;
      if (s.fase >= s.def.fases.length) {
        s.terminada = true;
        s.fase = s.def.fases.length - 1;
        s.t = f.dur;
      }
    }
  }

  function faseActual(s) { return s.def.fases[s.fase]; }
  // Progreso dentro de la fase, de 0 a 1.
  function u(s) {
    var f = faseActual(s);
    return Math.max(0, Math.min(1, s.t / f.dur));
  }

  /* Suavizados. Los tramos que arrancan y frenan de golpe se sienten mecánicos. */
  function suave(x) { return x * x * (3 - 2 * x); }
  function entra(x) { return 1 - Math.pow(1 - x, 3); }
  function sale(x) { return x * x * x; }

  /* ============ la montaña rusa ============ */

  /* El carro recorre el perfil de la vía. En la subida lo lleva la cadena a
     velocidad constante; a partir de la cima manda la gravedad: cuanto más
     abajo está, más rápido va. Es la misma cuenta que hace una montaña rusa
     de verdad, y por eso el ritmo se siente bien sin ajustar nada a mano. */

  // No es la gravedad real: es la que hace que el recorrido dure lo que tiene
// que durar en pantalla. Con la de verdad, el circuito se termina en un segundo.
var GRAVEDAD = 130;

  function montaniaArranque(ctx) {
    return {
      // Posición sobre la vía, de 0 a 1.
      p: 0,
      v: 0,
      alturaCima: 0,
      // Para el clac-clac de la cadena.
      ultimoClac: 0,
      clacs: 0,
      grito: false
    };
  }

  /* Punto de la vía y su pendiente, en coordenadas de mundo. */
  function puntoVia(ctx, p) {
    var pts = ctx.via;
    var i = Math.max(0, Math.min(pts.length - 2, Math.floor(p * (pts.length - 1))));
    var f = p * (pts.length - 1) - i;
    var a = pts[i], b = pts[i + 1];
    return {
      x: a.x + (b.x - a.x) * f,
      y: a.y + (b.y - a.y) * f,
      ang: Math.atan2(b.y - a.y, b.x - a.x)
    };
  }

  /* Avance físico del carro sobre la vía. */
  function montaniaFisica(s, ctx, dt) {
    var d = s.datos;
    var fase = faseActual(s).nombre;
    var pts = ctx.via;
    var largo = ctx.largoVia;

    if (fase === 'cadena') {
      // La cadena sube a velocidad pareja, sin importar la pendiente.
      d.v = 105;
      d.p += (d.v * dt) / largo;
      if (d.p > ctx.pCima) d.p = ctx.pCima;
      // Un clac por cada tramo de cadena.
      d.ultimoClac += dt;
      if (d.ultimoClac > .17) { d.ultimoClac = 0; d.clacs++; if (ctx.alClac) ctx.alClac(); }

    } else if (fase === 'cima') {
      // Se descuelga y se deja caer.
      d.v = 26;
      d.p += (d.v * dt) / largo;

    } else if (fase === 'recorrido') {
      var punto = puntoVia(ctx, d.p);
      // Energía: la velocidad sale de cuánto bajó respecto de la cima.
      var caida = punto.y - ctx.yCima;          // y crece hacia abajo
      var v2 = 2 * GRAVEDAD * Math.max(0, caida) + 900;
      d.v = Math.sqrt(v2);
      // Rozamiento proporcional a lo ya recorrido: cada loma llega con menos.
      d.v *= (1 - .10 * (d.p - ctx.pCima) / (1 - ctx.pCima));
      d.p += (d.v * dt) / largo;
      if (d.p > 1) d.p = 1;
      if (!d.grito && d.v > 250) { d.grito = true; if (ctx.alGrito) ctx.alGrito(); }

    } else if (fase === 'frenar') {
      d.v *= Math.pow(.08, dt);
      d.p += (d.v * dt) / largo;
      if (d.p > 1) d.p = 1;
    }
  }

  /* Dónde tiene que mirar la cámara durante la secuencia. */
  function montaniaCamara(s, ctx) {
    var fase = faseActual(s).nombre;
    var d = s.datos;
    if (fase === 'acercarse' || fase === 'bajar') {
      return { x: ctx.xEstacion + 80, y: 0, zoom: 1 };
    }
    var punto = puntoVia(ctx, d.p);
    // En la caída la cámara se acerca un poco: da vértigo.
    var zoom = 1;
    if (fase === 'recorrido') zoom = 1 + Math.min(.16, d.v / 2100);
    if (fase === 'cima') zoom = 1.06;
    return { x: punto.x, y: punto.y, zoom: zoom };
  }

  /* Dibuja el carro con Bel adentro, inclinado según la vía.
     camaraX es el desplazamiento del mundo; piso es la línea del suelo en
     pantalla. El zoom lo aplica el motor por fuera con un transform. */
  function dibujarCarro(cx, ctx, s, camaraX, piso) {
    var d = s.datos;
    var fase = faseActual(s).nombre;
    var punto = puntoVia(ctx, d.p);
    var sx = punto.x - camaraX;
    var sy = piso + punto.y;
    var esc = 1;

    cx.save();
    cx.translate(sx, sy);
    cx.rotate(punto.ang);

    var an = 108, al = 62;

    // Sombra sobre la vía.
    cx.fillStyle = 'rgba(0,0,0,.4)';
    cx.beginPath();
    cx.ellipse(0, al * .44, an * .58, al * .12, 0, 0, 6.2832);
    cx.fill();

    // Respaldo y pared de atrás: van antes que Bel para que quede adentro.
    cx.fillStyle = '#241a36';
    cx.beginPath();
    cx.moveTo(-an * .50, al * .40);
    cx.lineTo(-an * .54, -al * .66);
    cx.quadraticCurveTo(-an * .50, -al * .84, -an * .38, -al * .82);
    cx.lineTo(-an * .30, al * .40);
    cx.closePath();
    cx.fill();

    // Bel sentada adentro.
    cx.save();
    cx.translate(-an * .10, al * .26);
    B.sentada(cx, 0, 0, .80, 1);
    cx.restore();

    // Casco delantero del vagón: tapa a Bel de la cintura para abajo.
    cx.fillStyle = '#3a2a55';
    cx.beginPath();
    cx.moveTo(-an * .52, al * .02);
    cx.lineTo(an * .40, al * .02);
    cx.quadraticCurveTo(an * .58, al * .12, an * .52, al * .30);
    cx.quadraticCurveTo(an * .46, al * .44, an * .28, al * .44);
    cx.lineTo(-an * .34, al * .44);
    cx.quadraticCurveTo(-an * .56, al * .40, -an * .52, al * .02);
    cx.closePath();
    cx.fill();

    // Franja de color y filo iluminado.
    cx.fillStyle = '#c23a48';
    cx.beginPath();
    cx.moveTo(-an * .50, al * .12);
    cx.lineTo(an * .44, al * .12);
    cx.lineTo(an * .42, al * .26);
    cx.lineTo(-an * .50, al * .26);
    cx.closePath();
    cx.fill();
    cx.strokeStyle = 'rgba(255,200,140,.30)';
    cx.lineWidth = 1.6;
    cx.beginPath();
    cx.moveTo(-an * .52, al * .02);
    cx.lineTo(an * .40, al * .02);
    cx.stroke();

    // Trompa en punta.
    cx.fillStyle = '#48356b';
    cx.beginPath();
    cx.moveTo(an * .38, al * .02);
    cx.quadraticCurveTo(an * .74, al * .14, an * .56, al * .34);
    cx.lineTo(an * .36, al * .40);
    cx.closePath();
    cx.fill();

    // Barra de seguridad, por delante del torso.
    cx.strokeStyle = '#5a4a78';
    cx.lineWidth = 5;
    cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(-an * .34, -al * .18);
    cx.lineTo(an * .24, -al * .18);
    cx.stroke();
    cx.beginPath();
    cx.moveTo(-an * .34, -al * .18);
    cx.lineTo(-an * .40, al * .06);
    cx.stroke();

    // Ruedas.
    cx.fillStyle = '#12101c';
    [-an * .30, an * .24].forEach(function (rx) {
      cx.beginPath();
      cx.arc(rx, al * .46, 8, 0, 6.2832);
      cx.fill();
    });

    cx.restore();

    // Estela de velocidad en la caída.
    if (fase === 'recorrido' && d.v > 170) {
      var q = Math.min(1, (d.v - 170) / 240);
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      cx.strokeStyle = 'rgba(200,220,255,' + (.18 * q) + ')';
      cx.lineWidth = 1.6;
      for (var i = 0; i < 7; i++) {
        var off = (i - 3) * 12 * esc;
        var largo2 = (40 + i * 9) * q * esc;
        cx.beginPath();
        cx.moveTo(sx - Math.cos(punto.ang) * 30 * esc + off * Math.sin(punto.ang),
                  sy - Math.sin(punto.ang) * 30 * esc - off * Math.cos(punto.ang));
        cx.lineTo(sx - Math.cos(punto.ang) * (30 * esc + largo2) + off * Math.sin(punto.ang),
                  sy - Math.sin(punto.ang) * (30 * esc + largo2) - off * Math.cos(punto.ang));
        cx.stroke();
      }
      cx.restore();
    }
  }

  var DEFS = {
    montania: {
      arranque: montaniaArranque,
      fisica: montaniaFisica,
      camara: montaniaCamara,
      dibujar: dibujarCarro,
      fases: [
        { nombre: 'acercarse', dur: 1.8 },
        // La cuesta termina cuando llega arriba, no cuando se cumple un reloj.
        { nombre: 'cadena', dur: 14,
          hasta: function (s, ctx) { return s.datos.p >= ctx.pCima - .001; } },
        { nombre: 'cima', dur: 1.6 },
        { nombre: 'recorrido', dur: 16,
          hasta: function (s, ctx) { return s.datos.p >= .988; } },
        { nombre: 'frenar', dur: 2.0 },
        { nombre: 'bajar', dur: 1.8 }
      ],
      // Lo que se lee en pantalla en cada fase.
      rotulos: {
        acercarse: '',
        cadena: 'clac… clac… clac…',
        cima: '',
        recorrido: '',
        frenar: '',
        bajar: ''
      }
    }
  };

  return {
    iniciar: iniciar, avanzar: avanzar, faseActual: faseActual, u: u,
    puntoVia: puntoVia, DEFS: DEFS,
    suave: suave, entra: entra, sale: sale
  };
})();

/* ===== js/sentido.js ===== */
/* El sentido.

   Bel percibe cosas antes de que pasen. Al activarlo el tiempo casi se detiene,
   el oído se le agudiza y aparecen las señales: puntos donde hay algo que está
   por ocurrir o algo que no cierra.

   Es un recurso, no un modo: se gasta mientras está puesto y tarda en volver.
   Y hay señales que caducan — si no llegás a leerlas, pasa lo que iba a pasar.

   Reemplaza a la mirada anterior, que mostraba rastros bonitos pero inertes:
   se veían, no servían para nada. */
var Sentido = (function () {
  'use strict';

  var GASTO = .30;          // fracción de carga por segundo con el sentido puesto
  var RECARGA = .13;        // fracción por segundo cuando está guardado
  var LENTITUD = .16;       // a qué velocidad corre el mundo con el sentido puesto

  /* Las señales de cada atracción.
       tipo    'peligro' | 'presencia' | 'anomalia'
       x       posición relativa al centro de la parada
       y       altura sobre el piso (0 = suelo)
       aviso   lo que el sentido le grita antes de saber qué es
       info    lo que baja al leerla
       urgente si es true, caduca: hay que llegar antes de que se acabe la carga */
  var SENALES = {
    entrada: [{
      tipo: 'presencia', x: 120, y: -60,
      aviso: 'Alguien pasó por acá hace un rato',
      info: 'El molinete todavía está frenando. Alguien lo cruzó hace menos de un minuto, ' +
            'y lo cruzó para adentro. Bel es la segunda persona que entra esta noche.'
    }],
    tiro: [{
      tipo: 'peligro', x: -30, y: -95, urgente: true,
      aviso: 'Algo se va a caer',
      info: 'El rifle de la izquierda está apoyado en el borde y el mostrador tiene ' +
            'caída para afuera. En unos segundos se viene abajo. Bel lo corre antes.'
    }],
    calesita: [{
      tipo: 'anomalia', x: 40, y: -120,
      aviso: 'Esto no gira solo',
      info: 'La calesita no tiene el eje conectado al motor: el eje está cortado y ' +
            'las puntas ni se tocan. Gira igual, a la velocidad de siempre.'
    }],
    montania: [{
      tipo: 'peligro', x: -180, y: -260, urgente: true,
      aviso: 'La estructura está cediendo',
      info: 'La tercera columna de la subida tiene los bulones flojos y la madera ' +
            'partida en diagonal. Aguanta un viaje más. Bel lo sabe antes de subir, ' +
            'y sube igual.'
    }],
    chocadores: [{
      tipo: 'anomalia', x: 20, y: -140,
      aviso: 'Ese autito no debería andar',
      info: 'La llave general está baja y la malla del techo no tiene tensión. ' +
            'El autito que da vueltas no está tomando corriente de ningún lado.'
    }],
    espejos: [{
      tipo: 'presencia', x: 60, y: -150,
      aviso: 'Hay alguien del otro lado',
      info: 'En el panel del medio hay alguien parado, y no es un reflejo: cuando Bel ' +
            'se mueve, ese no se mueve. Espera a que ella se vaya para volver a caminar.'
    }],
    martillo: [{
      tipo: 'anomalia', x: 0, y: -300,
      aviso: 'Va a sonar',
      info: 'La campana está por sonar sin que nadie pegue. Bel cuenta hasta tres y ' +
            'suena. Después se queda callada, como si hubiera saludado.'
    }],
    rueda: [{
      tipo: 'peligro', x: 90, y: -220, urgente: true,
      aviso: 'Una cabina está por soltarse',
      info: 'La cabina que viene bajando tiene un solo perno y está trabajando torcida. ' +
            'Bel se corre del lugar donde va a caer. No cae: se endereza sola.'
    }],
    carpa: [{
      tipo: 'presencia', x: 0, y: -110,
      aviso: 'Adentro saben que estás acá',
      info: 'Hay alguien sentado adentro, quieto, con la cara hacia la puerta. ' +
            'No se movió desde que Bel entró a la feria. La está esperando desde antes.'
    }]
  };

  var COLORES = {
    peligro:   '255,120,110',
    presencia: '190,170,255',
    anomalia:  '150,230,210'
  };

  function crear() {
    return {
      activo: false,
      carga: 1,
      intensidad: 0,        // 0 mundo normal, 1 tiempo detenido
      leidas: {},
      perdidas: {},
      revelacion: null,     // la ficha que está en pantalla
      tRevelacion: 0,
      aviso: null,          // el texto corto del sentido
      tAviso: 0,
      pulso: 0              // onda que sale de Bel al activarlo
    };
  }

  /* Devuelve false si no había carga suficiente. */
  function activar(s) {
    if (s.activo) { s.activo = false; return false; }
    if (s.carga < .12) return false;
    s.activo = true;
    s.pulso = 1;
    return true;
  }

  function actualizar(s, dtReal) {
    if (s.activo) {
      s.carga -= GASTO * dtReal;
      if (s.carga <= 0) { s.carga = 0; s.activo = false; }
    } else if (!s.revelacion) {
      s.carga = Math.min(1, s.carga + RECARGA * dtReal);
    }
    var objetivo = s.activo ? 1 : 0;
    s.intensidad += (objetivo - s.intensidad) * (1 - Math.pow(0.0008, dtReal));
    if (s.pulso > 0) s.pulso = Math.max(0, s.pulso - dtReal * .9);
    if (s.tAviso > 0) { s.tAviso -= dtReal; if (s.tAviso <= 0) s.aviso = null; }
    if (s.tRevelacion > 0) {
      s.tRevelacion -= dtReal;
      if (s.tRevelacion <= 0) s.revelacion = null;
    }
  }

  /* Cuánto corre el mundo. Con el sentido puesto, casi nada. */
  function escalaTiempo(s) {
    return 1 - (1 - LENTITUD) * s.intensidad;
  }

  function senalCerca(s, parada, belX) {
    if (!s.activo || s.intensidad < .35) return null;
    var lista = SENALES[parada.clave];
    if (!lista) return null;
    for (var i = 0; i < lista.length; i++) {
      var sx = parada.x + lista[i].x;
      if (Math.abs(belX - sx) < 130) {
        lista[i]._x = sx; lista[i]._parada = parada.clave;
        return lista[i];
      }
    }
    return null;
  }

  /* La señal más cercana en cualquier parada, para el aviso general. */
  function avisar(s, paradas, belX) {
    if (!s.activo) return;
    for (var i = 0; i < paradas.length; i++) {
      var lista = SENALES[paradas[i].clave];
      if (!lista) continue;
      for (var j = 0; j < lista.length; j++) {
        var sx = paradas[i].x + lista[j].x;
        if (Math.abs(belX - sx) < 420 && !s.leidas[paradas[i].clave]) {
          if (s.aviso !== lista[j].aviso) { s.aviso = lista[j].aviso; s.tAviso = 3; }
          return;
        }
      }
    }
  }

  function leer(s, senal) {
    if (!senal || s.leidas[senal._parada]) return false;
    s.leidas[senal._parada] = true;
    s.revelacion = senal;
    s.tRevelacion = 7.5;
    s.activo = false;         // leerla consume el momento
    return true;
  }

  function contar(s) { return Object.keys(s.leidas).length; }
  function total() { return Object.keys(SENALES).length; }

  /* ---------- dibujo ---------- */

  /* Lo que pasa con la imagen cuando el tiempo se frena: el color se va,
     queda el contraste, y todo se pone un poco más frío. */
  function veloFondo(cx, s, W, H) {
    if (s.intensidad < .01) return;
    var q = s.intensidad;
    cx.save();
    cx.globalCompositeOperation = 'saturation';
    cx.fillStyle = 'hsl(0,' + Math.round(100 - 78 * q) + '%,50%)';
    cx.fillRect(-W, -H, W * 3, H * 3);
    cx.restore();
    cx.save();
    cx.fillStyle = 'rgba(10,16,34,' + (.30 * q) + ')';
    cx.fillRect(-W, -H, W * 3, H * 3);
    cx.restore();
  }

  /* La onda que sale de Bel al activarlo: es lo que hace que se sienta un
     sentido y no un filtro de color. */
  function onda(cx, s, belXPantalla, piso, H) {
    if (s.pulso <= 0) return;
    var q = s.pulso;
    var r = (1 - q) * H * 1.6;
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    cx.strokeStyle = 'rgba(170,200,255,' + (.30 * q * q) + ')';
    cx.lineWidth = 2 + 6 * q;
    cx.beginPath();
    cx.arc(belXPantalla, piso - H * .18, r, 0, 6.2832);
    cx.stroke();
    cx.strokeStyle = 'rgba(140,180,255,' + (.16 * q) + ')';
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.arc(belXPantalla, piso - H * .18, r * .72, 0, 6.2832);
    cx.stroke();
    cx.restore();
  }

  /* Una señal: un punto que late, con anillos. Los urgentes laten más rápido
     y se ponen rojos a medida que se agota la carga. */
  function dibujarSenal(cx, sen, s, x, y, t, leida, cerca) {
    var q = s.intensidad;
    if (q < .05) return;
    var col = leida ? '150,160,190' : COLORES[sen.tipo];
    var urge = sen.urgente && !leida ? (1 - s.carga) : 0;
    var ritmo = 2.2 + urge * 5;
    var late = .55 + .45 * Math.sin(t * ritmo + x * .01);

    cx.save();
    cx.globalAlpha = q;
    cx.globalCompositeOperation = 'lighter';

    // Anillos que se cierran hacia el punto.
    for (var i = 0; i < 3; i++) {
      var f = ((t * .7 + i / 3) % 1);
      var rr = 46 * (1 - f) + 8;
      cx.strokeStyle = 'rgba(' + col + ',' + (.30 * (1 - f) * (leida ? .4 : 1)) + ')';
      cx.lineWidth = 1.6;
      cx.beginPath();
      cx.arc(x, y, rr, 0, 6.2832);
      cx.stroke();
    }

    // Halo y punto.
    var g = cx.createRadialGradient(x, y, 0, x, y, 34);
    g.addColorStop(0, 'rgba(' + col + ',' + (.50 * late) + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, 34, 0, 6.2832); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,' + (.85 * late) + ')';
    cx.beginPath(); cx.arc(x, y, cerca ? 5 : 3.4, 0, 6.2832); cx.fill();

    // Marca de leída.
    if (leida) {
      cx.fillStyle = 'rgba(' + col + ',.7)';
      cx.font = "13px 'Cormorant Garamond',serif";
      cx.textAlign = 'center';
      cx.fillText('✦', x, y - 22);
    }
    cx.restore();
  }

  return {
    SENALES: SENALES, COLORES: COLORES,
    crear: crear, activar: activar, actualizar: actualizar,
    escalaTiempo: escalaTiempo, senalCerca: senalCerca, avisar: avisar,
    leer: leer, contar: contar, total: total,
    veloFondo: veloFondo, onda: onda, dibujarSenal: dibujarSenal
  };
})();

// ===== prototipo =====
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const elPrompt = document.getElementById('prompt');
const elRotulo = document.getElementById('rotulo');
const elAviso  = document.getElementById('aviso');
const elTocar  = document.getElementById('tocar');
const elCarga  = document.getElementById('carga');
const elCargaLleno = document.getElementById('cargaLleno');
const elSenal  = document.getElementById('senal');
const elFicha  = document.getElementById('ficha');
const elFichaTipo = document.getElementById('fichaTipo');
const elFichaTxt  = document.getElementById('fichaTxt');
const elContador  = document.getElementById('contador');

let W = 0, H = 0, dpr = 1, t = 0;

const luna = Luna.estado();
const m = Mundo.crear();
const bel = Bel.crear(340, 0);
const cielo = Cielo.crear();
const sentido = Sentido.crear();
const vistas = {};

let despY = 0, zoom = 1, despYObjetivo = 0, zoomObjetivo = 1;
let ctxMontania = null, secuencia = null, frenoSonado = false;

function armarMontania(){
  const parada = Mundo.PARADAS.find(p => p.clave === 'montania');
  const an = H * 2.10, al = H * .66;
  const pts = Atracciones.perfilMontania(parada.x, 0, an, al);
  let largo = 0;
  for (let i = 1; i < pts.length; i++)
    largo += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
  let iCima = 0;
  for (let i = 0; i < pts.length; i++) if (pts[i].y < pts[iCima].y) iCima = i;
  ctxMontania = {
    via: pts, largoVia: largo,
    pCima: iCima / (pts.length - 1), yCima: pts[iCima].y,
    xEstacion: pts[0].x, piso: 0,
    alClac: () => sonar('clac'), alGrito: () => sonar('viento')
  };
}

function medir(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cx.setTransform(dpr,0,0,dpr,0,0);
  Mundo.sembrar();
  armarMontania();
  m.camara = Math.max(0, Math.min(Mundo.ANCHO - W, bel.x - W*.40));
}
medir(); addEventListener('resize', medir);

/* ---------- sonido ---------- */
let ac = null, maestro = null, zumbido = null, zumbidoG = null;
function audio(){
  if (ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ac = new AC();
  maestro = ac.createGain(); maestro.gain.value = .5;
  maestro.connect(ac.destination);
  // Zumbido agudo del sentido: suena siempre, con el volumen en cero.
  zumbido = ac.createOscillator();
  zumbido.type = 'sine'; zumbido.frequency.value = 3100;
  zumbidoG = ac.createGain(); zumbidoG.gain.value = 0;
  zumbido.connect(zumbidoG).connect(maestro);
  zumbido.start();
  return ac;
}
function ruidoBuf(dur){
  const n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const b = ac.createBuffer(1, n, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2-1;
  const s = ac.createBufferSource(); s.buffer = b; s.start();
  return s;
}
function sonar(tipo){
  if (!audio()) return;
  if (ac.state === 'suspended') ac.resume();
  const ahora = ac.currentTime;
  if (tipo === 'clac'){
    const s = ruidoBuf(.05);
    const bp = ac.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=3;
    const g = ac.createGain();
    g.gain.setValueAtTime(.22, ahora);
    g.gain.exponentialRampToValueAtTime(.0001, ahora+.06);
    s.connect(bp).connect(g).connect(maestro);
  } else if (tipo === 'viento'){
    const s = ruidoBuf(3.2);
    const bp = ac.createBiquadFilter();
    bp.type='bandpass'; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(300, ahora);
    bp.frequency.linearRampToValueAtTime(1500, ahora+1.0);
    bp.frequency.linearRampToValueAtTime(500, ahora+3.0);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, ahora);
    g.gain.linearRampToValueAtTime(.16, ahora+.5);
    g.gain.linearRampToValueAtTime(0, ahora+3.1);
    s.connect(bp).connect(g).connect(maestro);
  } else if (tipo === 'freno'){
    const s = ruidoBuf(1.1);
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g = ac.createGain();
    g.gain.setValueAtTime(.14, ahora);
    g.gain.exponentialRampToValueAtTime(.0001, ahora+1.0);
    s.connect(lp).connect(g).connect(maestro);
  } else if (tipo === 'sentido'){
    // Al abrirse: un grave que se desploma, con un chirrido corto arriba.
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(420, ahora);
    o.frequency.exponentialRampToValueAtTime(58, ahora+.7);
    g.gain.setValueAtTime(.22, ahora);
    g.gain.exponentialRampToValueAtTime(.0001, ahora+.8);
    o.connect(g).connect(maestro); o.start(ahora); o.stop(ahora+.85);
    const s2 = ruidoBuf(.3);
    const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(.10, ahora);
    g2.gain.exponentialRampToValueAtTime(.0001, ahora+.3);
    s2.connect(hp).connect(g2).connect(maestro);
  } else if (tipo === 'revelar'){
    [784, 1175, 1568].forEach(function(f, i){
      const o = ac.createOscillator(), g = ac.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0, ahora+i*.10);
      g.gain.linearRampToValueAtTime(.06, ahora+i*.10+.01);
      g.gain.exponentialRampToValueAtTime(.0001, ahora+i*.10+2);
      o.connect(g).connect(maestro);
      o.start(ahora+i*.10); o.stop(ahora+i*.10+2.1);
    });
  } else if (tipo === 'mirar'){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine'; o.frequency.value=620;
    g.gain.setValueAtTime(0, ahora);
    g.gain.linearRampToValueAtTime(.05, ahora+.02);
    g.gain.exponentialRampToValueAtTime(.0001, ahora+.5);
    o.connect(g).connect(maestro); o.start(ahora); o.stop(ahora+.55);
  }
}

/* ---------- controles ---------- */
const teclas = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  teclas[k] = true;
  if (['arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'e') interactuar();
  if (k === ' ') {
    audio();
    if (Sentido.activar(sentido)) sonar('sentido');
  }
});
addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });

let tocando = 0;
elTocar.querySelectorAll('div').forEach(d => {
  const dir = +d.dataset.dir;
  d.addEventListener('pointerdown', e => { tocando = dir; d.setPointerCapture(e.pointerId); });
  d.addEventListener('pointerup', () => { tocando = 0; });
  d.addEventListener('pointercancel', () => { tocando = 0; });
});

function entrada(){
  if (secuencia || sentido.revelacion) return 0;
  let d = tocando;
  if (teclas['arrowleft'] || teclas['a']) d -= 1;
  if (teclas['arrowright'] || teclas['d']) d += 1;
  return Math.max(-1, Math.min(1, d));
}

function interactuar(){
  if (secuencia) return;
  if (sentido.revelacion){ sentido.tRevelacion = 0; sentido.revelacion = null; return; }
  const cerca = Mundo.paradaCerca(m, bel.x);
  if (!cerca) return;

  // Con el sentido puesto, E baja la información de la señal.
  const sen = Sentido.senalCerca(sentido, cerca, bel.x);
  if (sen && !sentido.leidas[cerca.clave]){
    if (Sentido.leer(sentido, sen)) sonar('revelar');
    return;
  }
  if (cerca.clave === 'montania'){
    audio();
    secuencia = Secuencias.iniciar('montania', ctxMontania);
    elTocar.classList.add('oculto');
    return;
  }
  if (cerca.mirar){
    elRotulo.textContent = cerca.mirar;
    elRotulo.classList.add('on');
    clearTimeout(window.__rot);
    window.__rot = setTimeout(() => elRotulo.classList.remove('on'), 6000);
    sonar('mirar');
    vistas[cerca.clave] = true;
  }
}

/* ---------- bucle ---------- */
let ultimo = performance.now();

function cuadro(ahora){
  const dtReal = Math.min(.05, (ahora - ultimo)/1000);
  ultimo = ahora;

  Sentido.actualizar(sentido, dtReal);
  // Con el sentido puesto el mundo casi se detiene; el sentido corre normal.
  const escala = Sentido.escalaTiempo(sentido);
  const dt = dtReal * escala;
  // Bel se mueve más rápido que el mundo frenado: el sentido es de ella.
  const dtBel = dtReal * (escala + (1 - escala) * .42);
  t += dt;

  if (zumbidoG && ac){
    zumbidoG.gain.setTargetAtTime(sentido.intensidad * .012, ac.currentTime, .08);
  }

  const dir = entrada();
  const objetivo = dir * Mundo.VELOCIDAD;
  bel.vx += (objetivo - bel.vx) * (1 - Math.pow(0.002, dtReal));
  if (Math.abs(bel.vx) < 3) bel.vx = 0;
  if (!secuencia){
    bel.x += bel.vx * dtBel;
    if (bel.x < 120) { bel.x = 120; bel.vx = 0; }
    if (bel.x > Mundo.ANCHO - 120) { bel.x = Mundo.ANCHO - 120; bel.vx = 0; }
    if (dir !== 0) bel.mirando = dir;
  }
  Bel.actualizar(bel, dtBel, !secuencia && Math.abs(bel.vx) > 4);

  let fase = null;
  if (secuencia){
    Secuencias.avanzar(secuencia, dt, ctxMontania);
    secuencia.def.fisica(secuencia, ctxMontania, dt);
    fase = Secuencias.faseActual(secuencia).nombre;
    if (fase === 'frenar' && !frenoSonado){ frenoSonado = true; sonar('freno'); }
    const c = secuencia.def.camara(secuencia, ctxMontania);
    m.camara = c.x - W/2;
    despYObjetivo = c.y; zoomObjetivo = c.zoom;
    if (secuencia.terminada){
      secuencia = null; frenoSonado = false;
      despYObjetivo = 0; zoomObjetivo = 1;
      elTocar.classList.remove('oculto');
      bel.x = ctxMontania.xEstacion + 120; bel.vx = 0; bel.mirando = 1;
    }
  } else {
    Mundo.seguirCamara(m, bel.x, W, dtReal);
    despYObjetivo = 0;
    // El sentido acerca un poco: la atención se estrecha.
    zoomObjetivo = 1 + sentido.intensidad * .05;
  }

  const k = 1 - Math.pow(0.004, dtReal);
  despY += (despYObjetivo - despY) * k;
  zoom  += (zoomObjetivo  - zoom)  * k;

  Sentido.avisar(sentido, Mundo.PARADAS, bel.x);

  /* ---------- dibujo ---------- */
  const piso = H * Mundo.SUELO;
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.clearRect(0,0,W,H);

  cx.save();
  cx.translate(W/2, piso);
  cx.scale(zoom, zoom);
  cx.translate(-W/2, -piso - despY);

  Dib.usar(cx, W, H, t, true);
  Mundo.fondo(cx, m, W, H, t, luna);
  Cielo.actualizar(cielo, dt);
  Cielo.dibujar(cx, cielo, W, H, t);
  Mundo.suelo(cx, m, W, H, t);
  Mundo.postes(cx, m, W, H, t);
  Mundo.guirnaldas(cx, m, W, H, t);
  Mundo.PARADAS.forEach(p => {
    const x = p.x - m.camara;
    if (x < -H*2.4 || x > W + H*2.4) return;
    Atracciones.dibujar(p.clave, cx, x, piso, H, t);
  });
  Mundo.trastos(cx, m, W, H, t);

  // El desaturado va acá: afecta a la feria, no a las señales ni a Bel.
  Sentido.veloFondo(cx, sentido, W, H);

  if (secuencia){
    if (fase === 'acercarse' || fase === 'bajar'){
      const u = Secuencias.u(secuencia);
      const desde = ctxMontania.xEstacion + 150, hasta = ctxMontania.xEstacion + 10;
      const p = fase === 'acercarse' ? Secuencias.suave(u) : Secuencias.suave(1-u);
      bel.vx = fase === 'acercarse' ? -150 : 150;
      bel.mirando = fase === 'acercarse' ? -1 : 1;
      Bel.dibujar(cx, bel, (desde + (hasta-desde)*p) - m.camara, piso, 1.0);
    }
    secuencia.def.dibujar(cx, ctxMontania, secuencia, m.camara, piso);
  } else {
    Bel.dibujar(cx, bel, bel.x - m.camara, piso, 1.0);
  }

  // Señales, encima de todo lo del mundo.
  if (sentido.intensidad > .04 && !secuencia){
    const cercaAhora = Mundo.paradaCerca(m, bel.x);
    Mundo.PARADAS.forEach(p => {
      const lista = Sentido.SENALES[p.clave];
      if (!lista) return;
      lista.forEach(sn => {
        const sx = p.x + sn.x - m.camara;
        if (sx < -120 || sx > W + 120) return;
        const cerca = cercaAhora === p && Math.abs(bel.x - (p.x + sn.x)) < 130;
        Sentido.dibujarSenal(cx, sn, sentido, sx, piso + sn.y, t,
          !!sentido.leidas[p.clave], cerca);
      });
    });
  }

  Sentido.onda(cx, sentido, bel.x - m.camara, piso, H);
  cx.restore();

  const g = cx.createRadialGradient(W/2, H*.45, Math.min(W,H)*(.75 - sentido.intensidad*.14),
                                    W/2, H*.45, Math.max(W,H)*.82);
  g.addColorStop(0,'rgba(4,5,9,0)');
  g.addColorStop(1,'rgba(4,5,9,' + (.55 + sentido.intensidad*.14) + ')');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);

  /* ---------- interfaz ---------- */
  elCargaLleno.style.width = Math.round(sentido.carga * 100) + '%';
  elCarga.classList.toggle('gastando', sentido.activo);
  elCarga.classList.toggle('vacia', sentido.carga < .2);

  if (sentido.aviso && !sentido.revelacion){
    elSenal.textContent = sentido.aviso;
    elSenal.classList.add('on');
  } else {
    elSenal.classList.remove('on');
  }

  if (sentido.revelacion){
    const r = sentido.revelacion;
    elFichaTipo.textContent = r.tipo;
    elFichaTipo.style.color = 'rgb(' + Sentido.COLORES[r.tipo] + ')';
    elFichaTxt.textContent = r.info;
    elFicha.classList.add('on');
  } else {
    elFicha.classList.remove('on');
  }

  elContador.textContent = Sentido.contar(sentido) + ' / ' + Sentido.total();

  if (secuencia || sentido.revelacion){
    elPrompt.classList.remove('on');
  } else {
    const cerca = Mundo.paradaCerca(m, bel.x);
    const sen = cerca ? Sentido.senalCerca(sentido, cerca, bel.x) : null;
    if (sen && !sentido.leidas[cerca.clave]){
      elPrompt.innerHTML = '<b>E</b>leer la señal';
      elPrompt.classList.add('on');
    } else if (cerca && !sentido.activo){
      elPrompt.innerHTML = '<b>E</b>' + (cerca.accion || 'mirar') +
        (vistas[cerca.clave] ? ' otra vez' : '');
      elPrompt.classList.add('on');
    } else {
      elPrompt.classList.remove('on');
    }
  }

  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);

window.__ir = x => { bel.x = x; m.camara = Math.max(0, Math.min(Mundo.ANCHO - W, x - W*.40)); };
window.__foto = nombre => {
  const c2 = document.createElement('canvas');
  c2.width = Math.min(1100, cv.width); c2.height = Math.round(c2.width * cv.height / cv.width);
  c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
  return c2.toDataURL();
};
</script>
